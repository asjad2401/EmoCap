<script>
const D = {"mode": "text", "seed": 300, "registers": ["joyful", "sad", "tense", "romantic", "humorous"], "source": "captions_corpus.jsonl", "items": [{"id": "072c2a6d8fc9", "text": "Standing beside the lattice gate, a man in a short-sleeved white shirt speaks quietly into his phone.", "image_id": "749840385_e004bf3b7c.jpg", "rel": "data/flickr8k/Images/749840385_e004bf3b7c.jpg"}, {"id": "d09150122666", "text": "Beside the sunny brick house, a dog springs up to snag its toy right out of the air.", "image_id": "3544673666_ffc7483c96.jpg", "rel": "data/flickr8k/Images/3544673666_ffc7483c96.jpg"}, {"id": "16fc6180f6be", "text": "Gripping the stone with heavy hiking boots, a man stands carefully in his cargo pants.", "image_id": "512550372_438849ce19.jpg", "rel": "data/flickr8k/Images/512550372_438849ce19.jpg"}, {"id": "588e36b25a81", "text": "A man rests against a red building, smoking quietly while looking down.", "image_id": "3322443827_a04a94bb91.jpg", "rel": "data/flickr8k/Images/3322443827_a04a94bb91.jpg"}, {"id": "e6cecbac9a3f", "text": "High-pressure streams converge from all sides of the ring right onto the standing child.", "image_id": "3657016761_d553e514d9.jpg", "rel": "data/flickr8k/Images/3657016761_d553e514d9.jpg"}, {"id": "d12ef59edf13", "text": "A climber ascends the smooth white curves of the floating object in the calm afternoon sun.", "image_id": "3691592651_6e4e7f1da9.jpg", "rel": "data/flickr8k/Images/3691592651_6e4e7f1da9.jpg"}, {"id": "e319fc407b3d", "text": "A man embraces a woman from behind, resting together at the railing while a ship drifts along the soft horizon.", "image_id": "795081510_53fd17d101.jpg", "rel": "data/flickr8k/Images/795081510_53fd17d101.jpg"}, {"id": "724992caab9e", "text": "Clad in a thick grey coat, the boy pauses to admire the intricate sea creature in his hand.", "image_id": "2355578735_286af5b202.jpg", "rel": "data/flickr8k/Images/2355578735_286af5b202.jpg"}, {"id": "5cbe6a2321c0", "text": "A skier plants both poles deep into the drifts while the golden retriever pauses amidst blinding snow flurries.", "image_id": "3397220683_4aca010f86.jpg", "rel": "data/flickr8k/Images/3397220683_4aca010f86.jpg"}, {"id": "103df0f6c7cb", "text": "A man in full cricket whites gets mislabeled while swinging a wooden plank at a flying ball.", "image_id": "3290105461_7590f23371.jpg", "rel": "data/flickr8k/Images/3290105461_7590f23371.jpg"}, {"id": "b9a7633f459f", "text": "A dog navigates the kitchen with a newspaper so wide its head is barely visible behind it.", "image_id": "2284239186_c827f4defa.jpg", "rel": "data/flickr8k/Images/2284239186_c827f4defa.jpg"}, {"id": "5cfbcb555863", "text": "Crouched low on the slick ice, the man braces his boots against the sloping surface.", "image_id": "2097420505_439f63c863.jpg", "rel": "data/flickr8k/Images/2097420505_439f63c863.jpg"}, {"id": "5d1102ba4c00", "text": "A person carrying a heavy pack wades through tall grass that conceals the ground beneath his feet.", "image_id": "469021173_aa31c07108.jpg", "rel": "data/flickr8k/Images/469021173_aa31c07108.jpg"}, {"id": "75906b8de417", "text": "Young people hold colourful frozen beverages alongside matching cartoon cutouts sipping their own drinks on the sidewalk.", "image_id": "782401952_5bc5d3413a.jpg", "rel": "data/flickr8k/Images/782401952_5bc5d3413a.jpg"}, {"id": "37a7d8d73073", "text": "Mid-stride in the flowing stream, the tan dog focuses intently on the bank.", "image_id": "1490213660_9ea45550cf.jpg", "rel": "data/flickr8k/Images/1490213660_9ea45550cf.jpg"}, {"id": "137a477497c9", "text": "Soft red strands of the helmet's tassel rest gently against the guard's patterned collar.", "image_id": "3649384501_f1e06c58c0.jpg", "rel": "data/flickr8k/Images/3649384501_f1e06c58c0.jpg"}, {"id": "7a642174cfeb", "text": "Moving fast, two dogs press away into the wide white space without breaking stride.", "image_id": "3122606953_a979dd3d33.jpg", "rel": "data/flickr8k/Images/3122606953_a979dd3d33.jpg"}, {"id": "79c761d33604", "text": "The sofa cushions have officially been converted into an indoor wrestling ring for two toddlers.", "image_id": "421316045_ae7a1eb4bc.jpg", "rel": "data/flickr8k/Images/421316045_ae7a1eb4bc.jpg"}, {"id": "22e8460d9360", "text": "Rowers surge across the deep blue water, blades cutting cleanly with every vigorous stroke.", "image_id": "3063544435_10516c6937.jpg", "rel": "data/flickr8k/Images/3063544435_10516c6937.jpg"}, {"id": "df7347924b79", "text": "A man sits on a low ledge beside the pavement, looking down as another passes by without stopping.", "image_id": "463978865_c87c6ca84c.jpg", "rel": "data/flickr8k/Images/463978865_c87c6ca84c.jpg"}, {"id": "284b2713bbd4", "text": "In the tight space between the counter and the loaded shelves, the shoppers do not move.", "image_id": "3293753378_7a8ddb98b2.jpg", "rel": "data/flickr8k/Images/3293753378_7a8ddb98b2.jpg"}, {"id": "54d6abd4636d", "text": "Three boys voluntarily position themselves under an absolute torrent of water.", "image_id": "1299459562_ed0e064aee.jpg", "rel": "data/flickr8k/Images/1299459562_ed0e064aee.jpg"}, {"id": "c659498d2e33", "text": "A young boy kicks the water near the rocks and manages to send half of it airborne.", "image_id": "3025513877_1a6160070d.jpg", "rel": "data/flickr8k/Images/3025513877_1a6160070d.jpg"}, {"id": "099f68362097", "text": "A lone person stays balanced on the bike under warm overhead lamps.", "image_id": "3182996527_70d9c323d5.jpg", "rel": "data/flickr8k/Images/3182996527_70d9c323d5.jpg"}, {"id": "31fd58a7c07f", "text": "Kicking sand into the air, three dogs tumble and roughhouse along the lake shore.", "image_id": "2895403073_906768cafa.jpg", "rel": "data/flickr8k/Images/2895403073_906768cafa.jpg"}, {"id": "17b4ae63f110", "text": "Two children drop toward the dark water together, disappearing into the wide surface.", "image_id": "3072611047_109bf8b7c3.jpg", "rel": "data/flickr8k/Images/3072611047_109bf8b7c3.jpg"}, {"id": "daae8656242b", "text": "The man with the ponytail and helmet looks on, quietly taking in the open path ahead.", "image_id": "2549452277_873cb80d3e.jpg", "rel": "data/flickr8k/Images/2549452277_873cb80d3e.jpg"}, {"id": "d209691d143a", "text": "Each person grips their section of fabric firmly, preventing the wind from catching the unpinned edges.", "image_id": "2057306459_2f52ce648e.jpg", "rel": "data/flickr8k/Images/2057306459_2f52ce648e.jpg"}, {"id": "2b89c513ebdf", "text": "Three men in caps lean close to the tall flames outside the cabin to read.", "image_id": "3138746531_f6b816c126.jpg", "rel": "data/flickr8k/Images/3138746531_f6b816c126.jpg"}, {"id": "ed163c708a0e", "text": "At the top of the playground slide, small hands hold the railings under bare branches.", "image_id": "2358554995_54ed3baa83.jpg", "rel": "data/flickr8k/Images/2358554995_54ed3baa83.jpg"}, {"id": "46c91390b078", "text": "A boy in swim shorts attempts to block an entire municipal water blast with one arm.", "image_id": "2892467862_52a3c67418.jpg", "rel": "data/flickr8k/Images/2892467862_52a3c67418.jpg"}, {"id": "c1335ceaf5cd", "text": "Protesters line the curb with IMPEACH umbrellas held firmly toward the intersection.", "image_id": "476740978_45b65ebe0c.jpg", "rel": "data/flickr8k/Images/476740978_45b65ebe0c.jpg"}, {"id": "f730e1ab6f57", "text": "A child in heavy layers strikes a pose while the adults behind her keep their backs turned.", "image_id": "2477623312_58e8e8c8af.jpg", "rel": "data/flickr8k/Images/2477623312_58e8e8c8af.jpg"}, {"id": "bb7364cc6dba", "text": "A jumping dog hangs in mid-flight with its hind leg stuck straight out to the side.", "image_id": "670609997_5c7fdb3f0b.jpg", "rel": "data/flickr8k/Images/670609997_5c7fdb3f0b.jpg"}, {"id": "709dfdc118f1", "text": "Under the pale stucco arches, a cyclist in black guides his green frame cleanly past the roadside sign.", "image_id": "3544483327_830349e7bc.jpg", "rel": "data/flickr8k/Images/3544483327_830349e7bc.jpg"}, {"id": "830becffdac7", "text": "The small boy stands poised with one hand raised abruptly above rows of heavy pumpkins.", "image_id": "3029928396_99ac250788.jpg", "rel": "data/flickr8k/Images/3029928396_99ac250788.jpg"}, {"id": "fe243108dc2a", "text": "Each bead of water catches the open light around the dog's wet fur.", "image_id": "1600208439_e94527b80f.jpg", "rel": "data/flickr8k/Images/1600208439_e94527b80f.jpg"}, {"id": "ccd257b96262", "text": "The woman stands alone on the hillside edge, dwarfed by the massive empty hills below.", "image_id": "2925242998_9e0db9b4a2.jpg", "rel": "data/flickr8k/Images/2925242998_9e0db9b4a2.jpg"}, {"id": "8fe807509617", "text": "Across the soft brown grass, one dog carefully holds its prize while the black poodle follows.", "image_id": "3500342526_393c739e2f.jpg", "rel": "data/flickr8k/Images/3500342526_393c739e2f.jpg"}, {"id": "276228ceea52", "text": "A tan dog in a bright red collar bounds forward alongside two shaggy white dogs by the sea.", "image_id": "3585488964_1467945775.jpg", "rel": "data/flickr8k/Images/3585488964_1467945775.jpg"}, {"id": "6a766b39f6c3", "text": "Wearing shirts that declare their affection for beer, two women walk past without engaging anyone nearby.", "image_id": "2724485630_7d2452df00.jpg", "rel": "data/flickr8k/Images/2724485630_7d2452df00.jpg"}, {"id": "6c0a7e9d7f38", "text": "A lone green boat navigates the heavy grey surge of water between dark stone walls.", "image_id": "3598447435_f66cd10bd6.jpg", "rel": "data/flickr8k/Images/3598447435_f66cd10bd6.jpg"}, {"id": "621d38da99ee", "text": "The poodle pushes off the sand at full tilt, casting a sharp dark shadow on the shore.", "image_id": "308307853_5a51fbdecc.jpg", "rel": "data/flickr8k/Images/308307853_5a51fbdecc.jpg"}, {"id": "feb1ab5d2944", "text": "Seated in a rigid line between the tall windows and bookstacks, people keep their backs turned without moving.", "image_id": "3367053761_8ec5834bf3.jpg", "rel": "data/flickr8k/Images/3367053761_8ec5834bf3.jpg"}, {"id": "71a5e91a915e", "text": "Springing from the grey stone rise, the bike rider turns a fast trick in mid-air.", "image_id": "2825668136_107223182c.jpg", "rel": "data/flickr8k/Images/2825668136_107223182c.jpg"}, {"id": "ca0a2efa2bb2", "text": "Tension tightens the plush toy as the little dog and the kneeling man pull in opposite directions.", "image_id": "2190137367_746335f707.jpg", "rel": "data/flickr8k/Images/2190137367_746335f707.jpg"}, {"id": "737f2e001f56", "text": "Surrounded by heavy motor traffic, the biker in spandex navigates the wide grey pavement.", "image_id": "1143373711_2e90b7b799.jpg", "rel": "data/flickr8k/Images/1143373711_2e90b7b799.jpg"}, {"id": "6e24d8ebe22e", "text": "In the bright park grass, a man gently pets the small brown dog right on its chest.", "image_id": "930748509_8ca5cf5c24.jpg", "rel": "data/flickr8k/Images/930748509_8ca5cf5c24.jpg"}, {"id": "fe287e62c553", "text": "He grips the boom tightly as the wind fills his clear sail, leaning hard against deep water.", "image_id": "2921578694_a46ae0d313.jpg", "rel": "data/flickr8k/Images/2921578694_a46ae0d313.jpg"}, {"id": "48c0f548b47c", "text": "Two people sit tightly perched on the loose stones, a heavy pack wedged securely by their feet.", "image_id": "1536597926_c2e1bc2379.jpg", "rel": "data/flickr8k/Images/1536597926_c2e1bc2379.jpg"}, {"id": "8da4fcdd8d67", "text": "A brightly illuminated eatery sits entirely open to the street, completely surrounded by empty pavement.", "image_id": "3366571152_20afb88ac1.jpg", "rel": "data/flickr8k/Images/3366571152_20afb88ac1.jpg"}, {"id": "1e4a1b3d795f", "text": "Clear daylight brightens the rocky wooded cliff as two people float past in their dark canoe.", "image_id": "2657484970_610e18144f.jpg", "rel": "data/flickr8k/Images/2657484970_610e18144f.jpg"}, {"id": "78a9f07c3497", "text": "Two teen girls take in the grand mountain panorama by simply plumping down on the indoor floor.", "image_id": "3533922605_a2b1e276f6.jpg", "rel": "data/flickr8k/Images/3533922605_a2b1e276f6.jpg"}, {"id": "d521cd7914b0", "text": "Brown hair brushes past the sunglasses and bright yellow shirt of the girl outside in daylight.", "image_id": "2718495608_d8533e3ac5.jpg", "rel": "data/flickr8k/Images/2718495608_d8533e3ac5.jpg"}, {"id": "6ce9afae8ca4", "text": "Mid-leap over the bed, the border collie hangs directly above the furniture with the tennis ball locked between its jaws.", "image_id": "2641288004_30ce961211.jpg", "rel": "data/flickr8k/Images/2641288004_30ce961211.jpg"}, {"id": "25add4c3fb65", "text": "Alone in front against the grey concrete, a man in white keeps running while two officers steadily follow.", "image_id": "3628043835_9d9bd595a7.jpg", "rel": "data/flickr8k/Images/3628043835_9d9bd595a7.jpg"}, {"id": "b8f08a0b171c", "text": "A boy steps out across the stones, skipping a rock over the clear creek water.", "image_id": "2987328689_96a2d814f1.jpg", "rel": "data/flickr8k/Images/2987328689_96a2d814f1.jpg"}, {"id": "c9344406880b", "text": "Dressed for warm weather, a crowd remains queued outside a building, waiting without moving forward.", "image_id": "3441104823_33cdae5a56.jpg", "rel": "data/flickr8k/Images/3441104823_33cdae5a56.jpg"}, {"id": "dd93adbbcf4d", "text": "The small green bucket stands out against the muted tones of the beach and the distant dunes.", "image_id": "3544233095_4bca71df1d.jpg", "rel": "data/flickr8k/Images/3544233095_4bca71df1d.jpg"}, {"id": "57e404a9dc84", "text": "An African American man falls away from his board into the relentless foam of the crashing ocean.", "image_id": "3211577298_14296db6fd.jpg", "rel": "data/flickr8k/Images/3211577298_14296db6fd.jpg"}, {"id": "281367dff9f9", "text": "Two people hold their stance on the dark asphalt, brightly illuminated under direct lighting.", "image_id": "3411393875_a9ff73c67a.jpg", "rel": "data/flickr8k/Images/3411393875_a9ff73c67a.jpg"}, {"id": "8f4c1c307e8c", "text": "The girls take a picture of themselves while other people nearby look entirely away.", "image_id": "2736902411_a0010f89ae.jpg", "rel": "data/flickr8k/Images/2736902411_a0010f89ae.jpg"}, {"id": "70d5a5e54585", "text": "A solemn young man in a suit sits holding his phone in the quiet train car.", "image_id": "1298866571_b4c496b71c.jpg", "rel": "data/flickr8k/Images/1298866571_b4c496b71c.jpg"}, {"id": "2bc168b15e24", "text": "The dog is running full speed through the meadow, surrounded only by dry, colourless scrub.", "image_id": "3294209955_a1f1e2cc19.jpg", "rel": "data/flickr8k/Images/3294209955_a1f1e2cc19.jpg"}, {"id": "0975d92c208a", "text": "Two small canoes drift over the bright, clear water beneath the green brush of the shoreline.", "image_id": "866841633_05d273b96d.jpg", "rel": "data/flickr8k/Images/866841633_05d273b96d.jpg"}, {"id": "315d1a9b0c10", "text": "Braided ties hang down past the soft knitted stitches of the sweater as she pauses thoughtfully in her warm hat.", "image_id": "2676184321_858eff416b.jpg", "rel": "data/flickr8k/Images/2676184321_858eff416b.jpg"}, {"id": "0494923cf2b2", "text": "With the match over, the losing wrestler stays on the mat, his face buried between his arms.", "image_id": "3196100539_102fe877b3.jpg", "rel": "data/flickr8k/Images/3196100539_102fe877b3.jpg"}, {"id": "065e23f183e9", "text": "The man in the tan shirt takes time out of his walk to give to the man in the hat.", "image_id": "3398276602_c7d106c34f.jpg", "rel": "data/flickr8k/Images/3398276602_c7d106c34f.jpg"}, {"id": "d9860de755d5", "text": "Two pale dogs sprint through the bright green grass, mouths open and heads high.", "image_id": "2606433181_f8f9d38579.jpg", "rel": "data/flickr8k/Images/2606433181_f8f9d38579.jpg"}, {"id": "63e80fcdeaf2", "text": "Legs fully outstretched front and back, the running greyhound hurtles forward without touching the earth.", "image_id": "2920516901_23d8571419.jpg", "rel": "data/flickr8k/Images/2920516901_23d8571419.jpg"}, {"id": "8eac853dc908", "text": "Three little kids race downhill on tiny tricycles toward the bare end of the road.", "image_id": "2291511815_ac083fddbd.jpg", "rel": "data/flickr8k/Images/2291511815_ac083fddbd.jpg"}, {"id": "3d61508fb7dc", "text": "A long caravan of green and red vehicles crawls slowly along the bare gravel path.", "image_id": "224766705_b77996527f.jpg", "rel": "data/flickr8k/Images/224766705_b77996527f.jpg"}, {"id": "6f1859df262e", "text": "The rounded shapes of countless colored spheres fill the enclosed play space completely.", "image_id": "1925434818_2949a8f6d8.jpg", "rel": "data/flickr8k/Images/1925434818_2949a8f6d8.jpg"}, {"id": "522534779b42", "text": "Her arm rests across his shoulders while his hand stays pressed to his face.", "image_id": "3035118753_69287079dc.jpg", "rel": "data/flickr8k/Images/3035118753_69287079dc.jpg"}, {"id": "b2f820aa96b4", "text": "The dog's wet black coat gleams under the bright sun as ripples fan out through the water.", "image_id": "1465666502_de289b3b9c.jpg", "rel": "data/flickr8k/Images/1465666502_de289b3b9c.jpg"}, {"id": "562769d3d891", "text": "A small cluster of white jasmine rests carefully in the woman's hands upon her crimson lap.", "image_id": "3669069522_555c97fbfb.jpg", "rel": "data/flickr8k/Images/3669069522_555c97fbfb.jpg"}, {"id": "71104bae9621", "text": "Children gather on the grass before a large crowd, proudly holding up their tall poles.", "image_id": "2810333931_47fd8dd340.jpg", "rel": "data/flickr8k/Images/2810333931_47fd8dd340.jpg"}, {"id": "9281443d6535", "text": "A man in a green jacket plays on while the singer stands turned away, looking down toward the floor.", "image_id": "3543378438_47e2712486.jpg", "rel": "data/flickr8k/Images/3543378438_47e2712486.jpg"}, {"id": "5c8c98452147", "text": "Three riders sit proudly on four-wheel ATVs amid the bright expanse of a harvested field.", "image_id": "109823394_83fcb735e1.jpg", "rel": "data/flickr8k/Images/109823394_83fcb735e1.jpg"}, {"id": "9c3e3ce4a967", "text": "The dog curls its entire pink tongue upward to clear a stubborn patch of snow from its snout.", "image_id": "3187117682_986ffd6b67.jpg", "rel": "data/flickr8k/Images/3187117682_986ffd6b67.jpg"}, {"id": "0d4b75a07dcc", "text": "Green fronds overhead cast soft, patterned shadows over the mule and the simple cart.", "image_id": "2265096094_8cc34d669c.jpg", "rel": "data/flickr8k/Images/2265096094_8cc34d669c.jpg"}, {"id": "c9db847a480f", "text": "A single black dog runs across the grass, holding a worn ball without anyone nearby.", "image_id": "282116218_7fd7583d6e.jpg", "rel": "data/flickr8k/Images/282116218_7fd7583d6e.jpg"}, {"id": "23ffe1eebb61", "text": "A cowgirl in bright plaid bounds over the barbed wire fence into the dry yard.", "image_id": "2039457436_fc30f5e1ce.jpg", "rel": "data/flickr8k/Images/2039457436_fc30f5e1ce.jpg"}, {"id": "7c9a9cfc950a", "text": "Flying low in the daylight, the pale owl fixes its sharp focus on whatever lies immediately ahead.", "image_id": "3525453732_f74a38f111.jpg", "rel": "data/flickr8k/Images/3525453732_f74a38f111.jpg"}, {"id": "86d16cacd5a8", "text": "Two football teams in crisp uniforms line up eagerly across the field to play.", "image_id": "2949762776_52ece64d28.jpg", "rel": "data/flickr8k/Images/2949762776_52ece64d28.jpg"}, {"id": "819d4d339f12", "text": "Passengers make the most of the afternoon, lounging comfortably on the boat seats in the sun.", "image_id": "2540750172_070250ece5.jpg", "rel": "data/flickr8k/Images/2540750172_070250ece5.jpg"}, {"id": "aa704207c0c0", "text": "Captured in mid-flight with arm extended, a boy sails clear off the high diving structure.", "image_id": "2789648482_1df61f224a.jpg", "rel": "data/flickr8k/Images/2789648482_1df61f224a.jpg"}, {"id": "d9a954189f09", "text": "A little girl takes on the lawn by bending entirely backwards and grinning at the sky.", "image_id": "3362805914_72f60ee8cb.jpg", "rel": "data/flickr8k/Images/3362805914_72f60ee8cb.jpg"}, {"id": "f88523255678", "text": "Mid-run, the small tan and white dog clears the hurdle just steps ahead of its moving trainer.", "image_id": "3695064885_a6922f06b2.jpg", "rel": "data/flickr8k/Images/3695064885_a6922f06b2.jpg"}, {"id": "b34e120fa14d", "text": "The athlete floats upward in clean arena light, cradling the orange sphere softly toward the woven hoop.", "image_id": "3127629248_a955b5763b.jpg", "rel": "data/flickr8k/Images/3127629248_a955b5763b.jpg"}, {"id": "2e7bffda1668", "text": "A girl drops toward the pool with outstretched arms as her family watches the afternoon unfold.", "image_id": "701816897_221bbe761a.jpg", "rel": "data/flickr8k/Images/701816897_221bbe761a.jpg"}, {"id": "2b1421fa185a", "text": "One player takes a full baseball-style swing, sending his opponent hopping into the air to dodge it.", "image_id": "3557295488_600d387347.jpg", "rel": "data/flickr8k/Images/3557295488_600d387347.jpg"}, {"id": "d4c14b8a739a", "text": "A fluffy bundle of black and grey fur essentially disappears nose-first into the lawn.", "image_id": "260162669_c79a900afb.jpg", "rel": "data/flickr8k/Images/260162669_c79a900afb.jpg"}, {"id": "0ce917998667", "text": "Two men stand together under the daylight against the bright textured blocks of a white brick building.", "image_id": "3217291172_10ef70af88.jpg", "rel": "data/flickr8k/Images/3217291172_10ef70af88.jpg"}, {"id": "06327b451710", "text": "Two construction workers casually dangle their legs off a building girder several stories in the air.", "image_id": "1055753357_4fa3d8d693.jpg", "rel": "data/flickr8k/Images/1055753357_4fa3d8d693.jpg"}, {"id": "12883637ef89", "text": "A single person glides on a parachute through cold air over empty, shadowed hills.", "image_id": "3359587274_4a2b140b84.jpg", "rel": "data/flickr8k/Images/3359587274_4a2b140b84.jpg"}, {"id": "f625545c684d", "text": "Two dogs barrel forward through short grass as if late for an urgent appointment in the empty field.", "image_id": "311267421_e204e643cf.jpg", "rel": "data/flickr8k/Images/311267421_e204e643cf.jpg"}, {"id": "95b7484bd6db", "text": "A child rests near the smooth wooden banister along the textured wall of the stairway.", "image_id": "2888386138_578d21033a.jpg", "rel": "data/flickr8k/Images/2888386138_578d21033a.jpg"}, {"id": "24ee9adc5107", "text": "A boy runs alone down a narrow concrete wall, the dry ground empty on either side.", "image_id": "2092177624_13ab757e8b.jpg", "rel": "data/flickr8k/Images/2092177624_13ab757e8b.jpg"}, {"id": "d721e8946cbb", "text": "Two white standard poodles face each other in the snow, their attention focused entirely on one shared toy.", "image_id": "3251906388_c09d44340e.jpg", "rel": "data/flickr8k/Images/3251906388_c09d44340e.jpg"}, {"id": "6aeaeebe6903", "text": "Surrounded by sweeping blue ridges, a rider in full dirt gear takes in the mountain height.", "image_id": "207930963_af3a2f1784.jpg", "rel": "data/flickr8k/Images/207930963_af3a2f1784.jpg"}, {"id": "b38d8bb9d027", "text": "The brown horse leaps high into the open air of the arena with tremendous power.", "image_id": "2656987333_80dcc82c05.jpg", "rel": "data/flickr8k/Images/2656987333_80dcc82c05.jpg"}, {"id": "941fc123f8f7", "text": "The young boy wears his cowboy hat proudly as he rides high atop the large chestnut horse.", "image_id": "2619267133_53a5904ef4.jpg", "rel": "data/flickr8k/Images/2619267133_53a5904ef4.jpg"}, {"id": "bae2c420d903", "text": "A group of young men sing together, each opening his mouth as wide as physically possible.", "image_id": "3574627719_790325430e.jpg", "rel": "data/flickr8k/Images/3574627719_790325430e.jpg"}, {"id": "5f874745a2dc", "text": "Under the stadium lights, the football player grips the ball with both hands and springs into his throwing stance.", "image_id": "2838085973_42b6e9b5b1.jpg", "rel": "data/flickr8k/Images/2838085973_42b6e9b5b1.jpg"}, {"id": "e5ca74cb8637", "text": "Riding a bicycle right between the red rails, a person leans forward over the drop.", "image_id": "3057618932_3b80ae85de.jpg", "rel": "data/flickr8k/Images/3057618932_3b80ae85de.jpg"}, {"id": "0226b55bcd06", "text": "A skier takes a night jump that launches them straight into the local foliage.", "image_id": "3239866450_3f8cfb0c83.jpg", "rel": "data/flickr8k/Images/3239866450_3f8cfb0c83.jpg"}, {"id": "425182b57f6b", "text": "A skier charges directly into the green water, throwing up bright white plumes of spray.", "image_id": "3527524436_a54aca78a9.jpg", "rel": "data/flickr8k/Images/3527524436_a54aca78a9.jpg"}, {"id": "dcf314b0451b", "text": "A person in a red jacket carves a smooth path across the quiet blanket of snow.", "image_id": "3304484212_b950233c30.jpg", "rel": "data/flickr8k/Images/3304484212_b950233c30.jpg"}, {"id": "b8583daea12d", "text": "A brown butterfly alights gently right on the girl's outstretched hand.", "image_id": "2707933554_f6dc5e0e3c.jpg", "rel": "data/flickr8k/Images/2707933554_f6dc5e0e3c.jpg"}, {"id": "d4b0369c5334", "text": "A child in a bright red sweatshirt and black helmet poses alongside an open-mouthed dog.", "image_id": "179009558_69be522c63.jpg", "rel": "data/flickr8k/Images/179009558_69be522c63.jpg"}, {"id": "bacf9d94a1a1", "text": "A bright red canoe carries two travelers down the winding forest river under the quiet pines.", "image_id": "2797188545_aeb26c54c0.jpg", "rel": "data/flickr8k/Images/2797188545_aeb26c54c0.jpg"}, {"id": "f2dbe10563d3", "text": "The racing winner accepts his trophy, having to share his victory step with an oversized promotional prop.", "image_id": "3491607076_922ec561d9.jpg", "rel": "data/flickr8k/Images/3491607076_922ec561d9.jpg"}, {"id": "4f08a9d96ab0", "text": "A trick rider flies above a giant painted word with nowhere to go but down.", "image_id": "3459871361_92d1ecda36.jpg", "rel": "data/flickr8k/Images/3459871361_92d1ecda36.jpg"}, {"id": "fdbf3900dad4", "text": "The woman keeps moving along the street as two dogs pace closely on the cracked asphalt.", "image_id": "1685463722_55843b6d3c.jpg", "rel": "data/flickr8k/Images/1685463722_55843b6d3c.jpg"}, {"id": "e4a8b6e1a72c", "text": "Three boys track the moving ball across the turf as the lead runner cuts inside.", "image_id": "2913965136_2d00136697.jpg", "rel": "data/flickr8k/Images/2913965136_2d00136697.jpg"}, {"id": "6b393756aca4", "text": "Summer light fills the air where the swimmer splashes beside the curved blue slide.", "image_id": "2528489543_546c1ca81f.jpg", "rel": "data/flickr8k/Images/2528489543_546c1ca81f.jpg"}, {"id": "4e166975116a", "text": "A little boy in a red shirt scrunches his entire face up at the camera while stuck in line.", "image_id": "1389651420_8d95d8f6ed.jpg", "rel": "data/flickr8k/Images/1389651420_8d95d8f6ed.jpg"}, {"id": "ae2bae8d3a45", "text": "Beside the armchair, the child in a blue scarf grips the toy firmly.", "image_id": "2657301826_aab4c36e6c.jpg", "rel": "data/flickr8k/Images/2657301826_aab4c36e6c.jpg"}, {"id": "28934fb4d940", "text": "Drawn into the cool shadow of the tall sheltered bench, he rests his head and closes his eyes.", "image_id": "2266061169_dfbf8f0595.jpg", "rel": "data/flickr8k/Images/2266061169_dfbf8f0595.jpg"}, {"id": "230f18266db6", "text": "A boy wearing pyjamas wedges his entire body into the sofa corner to wrangle one Santa hat.", "image_id": "3125628091_25a31709df.jpg", "rel": "data/flickr8k/Images/3125628091_25a31709df.jpg"}, {"id": "4565262b42c1", "text": "A small tan dog scuttles past the large brown dog who simply remains standing in the quiet grass.", "image_id": "3643087589_627a0a9e01.jpg", "rel": "data/flickr8k/Images/3643087589_627a0a9e01.jpg"}, {"id": "669431d5e1d8", "text": "The keeper stretches out on the turf, unable to stop the ball from crossing the line.", "image_id": "3232470286_903a61ea16.jpg", "rel": "data/flickr8k/Images/3232470286_903a61ea16.jpg"}, {"id": "e49a06efb08c", "text": "Heads turn and words pass swiftly between the group grouped closely against the pool rim.", "image_id": "3668984985_b60ceb2ae9.jpg", "rel": "data/flickr8k/Images/3668984985_b60ceb2ae9.jpg"}, {"id": "f31ae44c48a1", "text": "Two dogs occupy the yard near patio furniture, exhibiting drastically mismatched energy levels.", "image_id": "2419221084_01a14176b4.jpg", "rel": "data/flickr8k/Images/2419221084_01a14176b4.jpg"}, {"id": "deb03e71d0b1", "text": "Sharp, jagged peaks jut across the foreground and drop sharply toward distant ridges.", "image_id": "330325191_63e11d9c93.jpg", "rel": "data/flickr8k/Images/330325191_63e11d9c93.jpg"}, {"id": "fbaf90127327", "text": "Paws clawing for purchase, the dog scrambles hard up the steep dirt slope.", "image_id": "2738077433_10e6264b6f.jpg", "rel": "data/flickr8k/Images/2738077433_10e6264b6f.jpg"}, {"id": "8db38ca01969", "text": "A boy stares ahead wearing full-sized sunglasses that take up half his face.", "image_id": "2716457668_187a6d2b1c.jpg", "rel": "data/flickr8k/Images/2716457668_187a6d2b1c.jpg"}, {"id": "e48e56069651", "text": "A brown and white dog bounds eagerly across the open lawn, pressing close to the green grass.", "image_id": "2358898017_24496b80e8.jpg", "rel": "data/flickr8k/Images/2358898017_24496b80e8.jpg"}, {"id": "3f70f9551c4e", "text": "Turned away from the camera, three people stare out across the grey water from the edge of the dock.", "image_id": "2125216241_5b265a2fbc.jpg", "rel": "data/flickr8k/Images/2125216241_5b265a2fbc.jpg"}, {"id": "b6ce71214c3c", "text": "Both hands firmly clamp the small red guitar as the child confronts the toy microphone.", "image_id": "2056930414_d2b0f1395a.jpg", "rel": "data/flickr8k/Images/2056930414_d2b0f1395a.jpg"}, {"id": "0056adb77ea0", "text": "Two young children spend a slow afternoon together among scattered toys on the soft living room carpet.", "image_id": "2274992140_bb9e868bb8.jpg", "rel": "data/flickr8k/Images/2274992140_bb9e868bb8.jpg"}, {"id": "9dbf25343826", "text": "The boy in the dark shirt lingers by the glass facade, suspended in the drifting white trail.", "image_id": "633456174_b768c1d6cd.jpg", "rel": "data/flickr8k/Images/633456174_b768c1d6cd.jpg"}, {"id": "e0b004063e7f", "text": "Gravity takes over completely as a skier falls down the hill in full gear.", "image_id": "3248220732_0f173fc197.jpg", "rel": "data/flickr8k/Images/3248220732_0f173fc197.jpg"}, {"id": "38e0391393a5", "text": "One man clears another in mid-air, both suspended over a quiet, paved outdoor court.", "image_id": "2985439112_8a3b77d5c9.jpg", "rel": "data/flickr8k/Images/2985439112_8a3b77d5c9.jpg"}, {"id": "ca36c9d540d7", "text": "Wearing a matching red helmet and scarf, a woman cruises along on a small red and white motorcycle.", "image_id": "3534952095_975cca0056.jpg", "rel": "data/flickr8k/Images/3534952095_975cca0056.jpg"}, {"id": "9b6a94831a64", "text": "Juggling a plastic cup in one hand, she manages to position a massive clear ring right over her head.", "image_id": "2623939135_0cd02ffa5d.jpg", "rel": "data/flickr8k/Images/2623939135_0cd02ffa5d.jpg"}, {"id": "44e4fa131506", "text": "A little boy crosses the vast town square on a yellow bicycle, dwarfed by the massive stone buildings.", "image_id": "2586028627_ddd054d8cc.jpg", "rel": "data/flickr8k/Images/2586028627_ddd054d8cc.jpg"}, {"id": "d8b62af8af59", "text": "A grinning little girl pops her head out from behind the rough tree trunk into the bright sunlight.", "image_id": "3682038869_585075b5ff.jpg", "rel": "data/flickr8k/Images/3682038869_585075b5ff.jpg"}, {"id": "ede1f47d6a9d", "text": "Wearing pale pink against the weathered wood, she stands on the fence and gazes across at the horse.", "image_id": "3427233064_6af01bfc5c.jpg", "rel": "data/flickr8k/Images/3427233064_6af01bfc5c.jpg"}, {"id": "936f363c0c3b", "text": "One man withdraws his money at the terminal while another sits slouched and motionless on the pavement below.", "image_id": "948196883_e190a483b1.jpg", "rel": "data/flickr8k/Images/948196883_e190a483b1.jpg"}, {"id": "6ec47ec0fd7f", "text": "A dog rests on its leash beside the rough bark of a shaded tree.", "image_id": "2759813381_73303113d9.jpg", "rel": "data/flickr8k/Images/2759813381_73303113d9.jpg"}, {"id": "cd58de30f545", "text": "A tiny blonde girl poses at the edge of the frame, utterly dwarfed by the massive water fountain.", "image_id": "224369028_b1ac40d1fa.jpg", "rel": "data/flickr8k/Images/224369028_b1ac40d1fa.jpg"}, {"id": "b860401e71e6", "text": "A teenage boy gives another a spirited piggyback ride amid the open woodland trail.", "image_id": "3280672302_2967177653.jpg", "rel": "data/flickr8k/Images/3280672302_2967177653.jpg"}, {"id": "e0230ec8ee2d", "text": "Two dogs stand apart on bare, weathered grass with nothing else moving in the open expanse.", "image_id": "2314722788_6262c3aa40.jpg", "rel": "data/flickr8k/Images/2314722788_6262c3aa40.jpg"}, {"id": "6b355a629ad3", "text": "Balancing on his hind feet, the dog reaches for the water stream on the empty lawn.", "image_id": "44856031_0d82c2c7d1.jpg", "rel": "data/flickr8k/Images/44856031_0d82c2c7d1.jpg"}, {"id": "1b8658288d95", "text": "A woman wearing a yellow coat moves along the soft white snow under the trees.", "image_id": "2339140905_9f625f140a.jpg", "rel": "data/flickr8k/Images/2339140905_9f625f140a.jpg"}, {"id": "597a0eb09b05", "text": "Seated outside at an empty wooden board, the man looks far out toward the distant horizon.", "image_id": "2445442929_8c81d42460.jpg", "rel": "data/flickr8k/Images/2445442929_8c81d42460.jpg"}, {"id": "70c9b2123f72", "text": "A guy attempts to take his overshirt off while still balancing his sunglasses in hand.", "image_id": "1057210460_09c6f4c6c1.jpg", "rel": "data/flickr8k/Images/1057210460_09c6f4c6c1.jpg"}, {"id": "c45565ee5e21", "text": "The motocross racer banks hard into the dirt berm, kicking up a rooster tail of loose gravel.", "image_id": "3456862740_7550bcddc2.jpg", "rel": "data/flickr8k/Images/3456862740_7550bcddc2.jpg"}, {"id": "8fd8c2102f1e", "text": "One leg thrust forward with toes pointed, she hangs poised mid-jump before the matching troupe.", "image_id": "3246773992_89bf86937b.jpg", "rel": "data/flickr8k/Images/3246773992_89bf86937b.jpg"}, {"id": "66ab1c9d2791", "text": "Sunlight catches the child mid-flight as he leaps over the shallow pool in his sneakers.", "image_id": "1159574340_99ba8c3c59.jpg", "rel": "data/flickr8k/Images/1159574340_99ba8c3c59.jpg"}, {"id": "e061b290fc23", "text": "Three kids sit atop the stairs, having successfully walked all the way up just to sit down.", "image_id": "3486154327_8be7c78569.jpg", "rel": "data/flickr8k/Images/3486154327_8be7c78569.jpg"}, {"id": "52d36732b0ee", "text": "With jaws wide open just above the sand, the small dog snaps down on the ball.", "image_id": "252504549_135b0db5a3.jpg", "rel": "data/flickr8k/Images/252504549_135b0db5a3.jpg"}, {"id": "a8e9c18f237e", "text": "Two girls clash in a karate hold, locked tightly together on the floor.", "image_id": "2473737724_355599a263.jpg", "rel": "data/flickr8k/Images/2473737724_355599a263.jpg"}, {"id": "ebcf49f87276", "text": "On the grey cement stairs, a woman sits with her head in her hands, looking down.", "image_id": "2508249781_36e9282423.jpg", "rel": "data/flickr8k/Images/2508249781_36e9282423.jpg"}, {"id": "449ad6bee40e", "text": "The dark bull stands motionless in the sparse dry grass beside the parked red car.", "image_id": "791338571_7f38510bf7.jpg", "rel": "data/flickr8k/Images/791338571_7f38510bf7.jpg"}, {"id": "b0e8354539a9", "text": "A massive athletic hound commits all of its strength to overtaking a small rag tied to a cord.", "image_id": "3540416981_4e74f08cbb.jpg", "rel": "data/flickr8k/Images/3540416981_4e74f08cbb.jpg"}, {"id": "c44673da6290", "text": "Behind thick glasses, the girl gives her right pointer finger and its miniature passenger an immense startled stare.", "image_id": "516648762_0cff84ea97.jpg", "rel": "data/flickr8k/Images/516648762_0cff84ea97.jpg"}, {"id": "4db9ac243700", "text": "A brown dog charges down the snowy trail with aerodynamic ears and a wide open grin.", "image_id": "3165750962_e2e3843679.jpg", "rel": "data/flickr8k/Images/3165750962_e2e3843679.jpg"}, {"id": "44d54c67465c", "text": "A man finds himself completely unable to stop laughing as a formal-wear cheek kiss lands mid-snapshot.", "image_id": "133189853_811de6ab2a.jpg", "rel": "data/flickr8k/Images/133189853_811de6ab2a.jpg"}, {"id": "8976a5bc0381", "text": "Two women have claimed a wooden park bench and show zero intention of giving up their spots.", "image_id": "3702607829_2b8b3e65ab.jpg", "rel": "data/flickr8k/Images/3702607829_2b8b3e65ab.jpg"}, {"id": "002b342d8a79", "text": "The woman stands looking at the colorful rows of glossy magazines displayed across the wide kiosk.", "image_id": "2688102742_885e578a3f.jpg", "rel": "data/flickr8k/Images/2688102742_885e578a3f.jpg"}, {"id": "5cefee613c2b", "text": "A greyhound races down the lane with brisk speed in a vivid red shirt and bright blue muzzle.", "image_id": "2936590102_25036069a6.jpg", "rel": "data/flickr8k/Images/2936590102_25036069a6.jpg"}, {"id": "de8d46d06687", "text": "A bearded collie bounds cleanly above the agility bars with paws tucked high in mid-leap.", "image_id": "3457315666_b943111dec.jpg", "rel": "data/flickr8k/Images/3457315666_b943111dec.jpg"}, {"id": "b5b37320f171", "text": "Soft light falls across the fabric of their athletic gear as two boys ease into their stretches.", "image_id": "2230067846_74046b89d3.jpg", "rel": "data/flickr8k/Images/2230067846_74046b89d3.jpg"}, {"id": "b90c29a8b8da", "text": "Proud owners display prize ribbons while standing with their dogs across the bright open field.", "image_id": "3283368342_b96d45210e.jpg", "rel": "data/flickr8k/Images/3283368342_b96d45210e.jpg"}, {"id": "63812510ea5e", "text": "With muscles bunched, a pitbull powers straight through the snow on a direct course.", "image_id": "2169951750_495820a215.jpg", "rel": "data/flickr8k/Images/2169951750_495820a215.jpg"}, {"id": "e82be51339e5", "text": "Clear water catches the bright midday light around the laughing girl as she glides down the slide.", "image_id": "2804374083_311f98f5f2.jpg", "rel": "data/flickr8k/Images/2804374083_311f98f5f2.jpg"}, {"id": "f456da7ef3ff", "text": "A little boy pauses over his small trains in the soft indoor light of the room.", "image_id": "388386075_9ac3a89ada.jpg", "rel": "data/flickr8k/Images/388386075_9ac3a89ada.jpg"}, {"id": "552348acda5a", "text": "Right at the crest of the wave, the surfer balances on the edge of the rushing wall.", "image_id": "3707990914_843e8f15f1.jpg", "rel": "data/flickr8k/Images/3707990914_843e8f15f1.jpg"}, {"id": "bbf667da30fe", "text": "A little child in a blue helmet focuses intently on riding the skateboard along the concrete curve.", "image_id": "2635164923_2a774f7854.jpg", "rel": "data/flickr8k/Images/2635164923_2a774f7854.jpg"}, {"id": "787cc725b2f8", "text": "The boy stands knee-deep in water while a bright pink Frisbee hovers stubbornly out of reach.", "image_id": "195962284_e57178054a.jpg", "rel": "data/flickr8k/Images/195962284_e57178054a.jpg"}, {"id": "898959014319", "text": "The child gets credit for climbing the playground bars after being hoisted the entire height.", "image_id": "539744890_85e63f5854.jpg", "rel": "data/flickr8k/Images/539744890_85e63f5854.jpg"}, {"id": "060ccc6ef854", "text": "Gripping the overhead cables, a woman carefully places one foot before the other across the bridge.", "image_id": "136644885_f7d2bbf546.jpg", "rel": "data/flickr8k/Images/136644885_f7d2bbf546.jpg"}, {"id": "cc96b43bfcd6", "text": "A large group of onlookers gathers behind orange fencing to watch a dog climb steps.", "image_id": "1773928579_5664a810dc.jpg", "rel": "data/flickr8k/Images/1773928579_5664a810dc.jpg"}, {"id": "e7d00afcd8e2", "text": "Feet locked in place, the skateboarder clears the top edge of the ramp without ground below.", "image_id": "3223606402_bb2aa6db95.jpg", "rel": "data/flickr8k/Images/3223606402_bb2aa6db95.jpg"}, {"id": "18e8792cbc40", "text": "A solitary white greyhound runs along the dirt lane, wearing its jacket under the dim overhead lights.", "image_id": "2858759108_6e697c5f3e.jpg", "rel": "data/flickr8k/Images/2858759108_6e697c5f3e.jpg"}, {"id": "2fbe09a419c4", "text": "The dog catches its toy in midair, playing alone on the patch of grass beside the trees.", "image_id": "251792066_b5233b3d86.jpg", "rel": "data/flickr8k/Images/251792066_b5233b3d86.jpg"}, {"id": "1b3d4a595631", "text": "The spotted dog appears to be reconsidering its choices as a husky barrels directly onto its heels.", "image_id": "460478198_83039f2593.jpg", "rel": "data/flickr8k/Images/460478198_83039f2593.jpg"}, {"id": "526ce5259f5a", "text": "A child in native clothing carries a flower arrangement taller than the child's head.", "image_id": "2420546021_4a59790da6.jpg", "rel": "data/flickr8k/Images/2420546021_4a59790da6.jpg"}, {"id": "a754acc6964e", "text": "A small brown dog chases its ball down the wide shoreline with no other companion near.", "image_id": "3298233193_d2a550840d.jpg", "rel": "data/flickr8k/Images/3298233193_d2a550840d.jpg"}, {"id": "eda421e9148e", "text": "A boy sits deep in an armchair with a guitar and an unread picture book beside him.", "image_id": "2201222219_8d656b0633.jpg", "rel": "data/flickr8k/Images/2201222219_8d656b0633.jpg"}, {"id": "9bd133fcd474", "text": "A child in a red parka demonstrates that snow pants make perfectly functional sleds.", "image_id": "2385744837_8780f6731a.jpg", "rel": "data/flickr8k/Images/2385744837_8780f6731a.jpg"}, {"id": "ab1d9ba69d82", "text": "In a sunny open park, a boy launches his bicycle from the concrete ramp to perform tricks overhead.", "image_id": "3722507770_0d6cb7420e.jpg", "rel": "data/flickr8k/Images/3722507770_0d6cb7420e.jpg"}, {"id": "f9a0f89be32d", "text": "One dog attempts a dramatic bite while opening its mouth far wider than necessary.", "image_id": "3348384389_73b6647017.jpg", "rel": "data/flickr8k/Images/3348384389_73b6647017.jpg"}, {"id": "e3a7ef8beefa", "text": "A man in dark frames inspects his drink with deep and unnecessary concentration.", "image_id": "2266142543_b2de18c081.jpg", "rel": "data/flickr8k/Images/2266142543_b2de18c081.jpg"}, {"id": "22b607b442d5", "text": "Resting comfortably on the shaggy rug, the brown and black dog enjoys the thick textured floor.", "image_id": "1244140539_da4804d828.jpg", "rel": "data/flickr8k/Images/1244140539_da4804d828.jpg"}, {"id": "604b45e84699", "text": "Near bare branches, two women in dark garments walk silently, one tucked into an upraised collar.", "image_id": "2078311270_f01c9eaf4c.jpg", "rel": "data/flickr8k/Images/2078311270_f01c9eaf4c.jpg"}, {"id": "4572a5862e7f", "text": "Two children hug with radiant smiles, leaning all their weight into a cheerful, energetic embrace.", "image_id": "2324979199_4193ef7537.jpg", "rel": "data/flickr8k/Images/2324979199_4193ef7537.jpg"}, {"id": "dfde852e1352", "text": "Given an entire valley of dirt, the rider aims straight for the pointiest rock.", "image_id": "216172386_9ac5356dae.jpg", "rel": "data/flickr8k/Images/216172386_9ac5356dae.jpg"}, {"id": "66ce3d04ea89", "text": "The vivid blue water reflects the afternoon light as the swimmer tracks the child's jump.", "image_id": "1236951314_0308dc4138.jpg", "rel": "data/flickr8k/Images/1236951314_0308dc4138.jpg"}, {"id": "7da072edb079", "text": "Ropes gently ease a wrapped piece of furniture out into the warm afternoon air.", "image_id": "3016651969_746bd36e68.jpg", "rel": "data/flickr8k/Images/3016651969_746bd36e68.jpg"}, {"id": "c01abe533409", "text": "The rider guides the bike smoothly against the curve of the dirt embankment.", "image_id": "3458559770_12cf9f134e.jpg", "rel": "data/flickr8k/Images/3458559770_12cf9f134e.jpg"}, {"id": "f9a3b106423f", "text": "Under the tall flag and bright sky, a girl rides her bike along the street near the shops.", "image_id": "2868776402_aef437e493.jpg", "rel": "data/flickr8k/Images/2868776402_aef437e493.jpg"}, {"id": "bf2fe5a0387d", "text": "Four pedestrians make their way along the wide city sidewalk while the green hat wearer talks on a cellphone.", "image_id": "3666056567_661e25f54c.jpg", "rel": "data/flickr8k/Images/3666056567_661e25f54c.jpg"}, {"id": "57f4c60a01a9", "text": "Sunlight catches the toddler's blond hair as she pauses by the bright playground railing.", "image_id": "449287870_f17fb825d7.jpg", "rel": "data/flickr8k/Images/449287870_f17fb825d7.jpg"}, {"id": "47740314444d", "text": "The gray egret takes flight into empty air, leaving the ground behind in quiet solitude.", "image_id": "3175712926_5a470d0886.jpg", "rel": "data/flickr8k/Images/3175712926_5a470d0886.jpg"}, {"id": "d2bf5176f6c1", "text": "Only one surfer is visible on the rolling water, surrounded by grey-blue sea and white foam.", "image_id": "3481884992_45770ec698.jpg", "rel": "data/flickr8k/Images/3481884992_45770ec698.jpg"}, {"id": "161a8da2fe08", "text": "A man carefully photographs two men who have turned completely away from the main event.", "image_id": "3475111806_f0d2927707.jpg", "rel": "data/flickr8k/Images/3475111806_f0d2927707.jpg"}, {"id": "8ac50bc22f52", "text": "Fine white flakes drift gently from the ruffled brown coat as the dog shakes itself.", "image_id": "2315807231_6948b3f3a5.jpg", "rel": "data/flickr8k/Images/2315807231_6948b3f3a5.jpg"}, {"id": "59f5f46d45cb", "text": "Two people attempt to occupy the bed while the massive pillows claim most of the space.", "image_id": "1770036088_08abe4f6e9.jpg", "rel": "data/flickr8k/Images/1770036088_08abe4f6e9.jpg"}, {"id": "e53d4cb295a6", "text": "Several people decide the proper way to experience a canyon is while fully reclined in chairs.", "image_id": "3401039304_424ffc7dbf.jpg", "rel": "data/flickr8k/Images/3401039304_424ffc7dbf.jpg"}, {"id": "154f9f7f5bc6", "text": "One arm stretched upward, the costumed marcher faces the surrounding wall of onlookers.", "image_id": "3681651647_08eba60f89.jpg", "rel": "data/flickr8k/Images/3681651647_08eba60f89.jpg"}, {"id": "e8c213f50589", "text": "Wearing jeans and flip-flops, a woman holds two blonde toddler girls dressed in pink on the lawn.", "image_id": "582899605_d96f9201f1.jpg", "rel": "data/flickr8k/Images/582899605_d96f9201f1.jpg"}, {"id": "8fdbcec72c1a", "text": "Two dogs with a whole yard of space choose to occupy the exact same square inch above a ball.", "image_id": "496380034_d22aeeedb3.jpg", "rel": "data/flickr8k/Images/496380034_d22aeeedb3.jpg"}, {"id": "7b7f6a89bfe6", "text": "Soft tracks and rolling drifts carve the backdrop while a snowboarder floats gently across the mound.", "image_id": "3359530430_249f51972c.jpg", "rel": "data/flickr8k/Images/3359530430_249f51972c.jpg"}, {"id": "d24029216d50", "text": "Refusing to turn toward the shore, the brown dog chooses to race the wave side by side instead.", "image_id": "2417745327_a2c2705043.jpg", "rel": "data/flickr8k/Images/2417745327_a2c2705043.jpg"}, {"id": "1287f8a92e69", "text": "A man grips the single paddle to keep the boat steady with two children seated in the back.", "image_id": "2694426634_118566f7ab.jpg", "rel": "data/flickr8k/Images/2694426634_118566f7ab.jpg"}, {"id": "39af83c2e042", "text": "The brown and white dog rolls around on the grass as if walking upright were overrated.", "image_id": "3393394134_0caac47e1c.jpg", "rel": "data/flickr8k/Images/3393394134_0caac47e1c.jpg"}, {"id": "1b8a82d84163", "text": "A little girl in a sunny yellow dress stands perkily in front of the red restaurant awning.", "image_id": "2545363449_1985903f82.jpg", "rel": "data/flickr8k/Images/2545363449_1985903f82.jpg"}, {"id": "0760db0ebc73", "text": "Every person remains locked in precise formation, their heavy sleeves extended in unison.", "image_id": "3111897772_5211a37a02.jpg", "rel": "data/flickr8k/Images/3111897772_5211a37a02.jpg"}, {"id": "ede05d7646bc", "text": "Suspended right above the wire rail, the brown dog lands as the following dog closes the distance.", "image_id": "293879742_5fe0ffd894.jpg", "rel": "data/flickr8k/Images/293879742_5fe0ffd894.jpg"}, {"id": "299c7cca3a6c", "text": "The fishermen spend a lovely warm day working very hard at sitting completely still on a concrete step.", "image_id": "2030781555_b7ff7be28f.jpg", "rel": "data/flickr8k/Images/2030781555_b7ff7be28f.jpg"}, {"id": "fbfe1dc975d8", "text": "Two people share the quiet expanse of the high granite ledge together above the rippling ocean waves.", "image_id": "801607443_f15956d1ce.jpg", "rel": "data/flickr8k/Images/801607443_f15956d1ce.jpg"}, {"id": "ac82459cc282", "text": "A wall of churned white water crashes directly into the child's face.", "image_id": "630476551_2ee7399f77.jpg", "rel": "data/flickr8k/Images/630476551_2ee7399f77.jpg"}, {"id": "eab4a2925cd0", "text": "Three children gather in the clear daylight right beside two huge tractor tires.", "image_id": "3060519665_4d6b9a51b2.jpg", "rel": "data/flickr8k/Images/3060519665_4d6b9a51b2.jpg"}, {"id": "052b0bf12440", "text": "Guests crowd closely around the table as the newlyweds listen from their tall ornate chairs.", "image_id": "3712574653_e009f76d19.jpg", "rel": "data/flickr8k/Images/3712574653_e009f76d19.jpg"}, {"id": "ded3c2d9aa0b", "text": "Warm golden light spills across the cavernous terminal floor as travellers linger together near the luggage carousels.", "image_id": "1397295388_8a5b6b525d.jpg", "rel": "data/flickr8k/Images/1397295388_8a5b6b525d.jpg"}, {"id": "d29ddd2b71fc", "text": "One person slides down the hill while the dog provides an unrequested high-speed escort.", "image_id": "3204686006_88f04547b9.jpg", "rel": "data/flickr8k/Images/3204686006_88f04547b9.jpg"}, {"id": "f6c681053340", "text": "A lively girl bounds upward into the air as the two play indoors together.", "image_id": "3106562372_e349a27764.jpg", "rel": "data/flickr8k/Images/3106562372_e349a27764.jpg"}, {"id": "4e28abdcb46f", "text": "Soft creases frame his eyes as the player in the blue shirt smiles gently toward the sun.", "image_id": "3421547427_53411b6278.jpg", "rel": "data/flickr8k/Images/3421547427_53411b6278.jpg"}, {"id": "85011a1f9f7e", "text": "Near the quiet grey dwelling, a female jumps upward with arms outstretched into the empty yard.", "image_id": "3477681171_b1bb8b211d.jpg", "rel": "data/flickr8k/Images/3477681171_b1bb8b211d.jpg"}, {"id": "ce11a9e9b406", "text": "A child wearing a black cap with an orange stripe rests motionless inside the cold, shaded snow tunnel.", "image_id": "822836318_21544f0f78.jpg", "rel": "data/flickr8k/Images/822836318_21544f0f78.jpg"}, {"id": "cafdbdaa21de", "text": "Bright shirts flash against the green trees as both boys spring high off the trampoline mat.", "image_id": "2850719435_221f15e951.jpg", "rel": "data/flickr8k/Images/2850719435_221f15e951.jpg"}, {"id": "e88c1bb2bf34", "text": "The boy in red and the girl in pink advance into the empty field without turning back.", "image_id": "438639005_208bc59b0b.jpg", "rel": "data/flickr8k/Images/438639005_208bc59b0b.jpg"}, {"id": "c54d94fd2b23", "text": "Amid the gentle hum of voices, the young girl turns her profile quietly toward the distance.", "image_id": "3364861247_d590fa170d.jpg", "rel": "data/flickr8k/Images/3364861247_d590fa170d.jpg"}, {"id": "e6219f2ef9e8", "text": "Peeking out between two sunny mounds of dried corn husk, a woman waves with an open grin.", "image_id": "3003612178_8230d65833.jpg", "rel": "data/flickr8k/Images/3003612178_8230d65833.jpg"}, {"id": "e0ec970132fc", "text": "The young rider relaxes barefoot in the saddle while the man in yellow provides manual stabilization.", "image_id": "3320154278_c67e01b8d1.jpg", "rel": "data/flickr8k/Images/3320154278_c67e01b8d1.jpg"}, {"id": "1c9333a97a89", "text": "Water flies everywhere as the skier soars gracefully above the crest of the wave.", "image_id": "2937697444_2367ff0e28.jpg", "rel": "data/flickr8k/Images/2937697444_2367ff0e28.jpg"}, {"id": "c62236650626", "text": "Amid the assembled group, two men meet hand to hand around the simple shape of a small box.", "image_id": "3351667632_00f586a30c.jpg", "rel": "data/flickr8k/Images/3351667632_00f586a30c.jpg"}, {"id": "a358ae711ffc", "text": "Beside a wall filled with magazine posters, two young women lounge across the bed and strike bright poses.", "image_id": "3279988814_d3693dcb6c.jpg", "rel": "data/flickr8k/Images/3279988814_d3693dcb6c.jpg"}, {"id": "1eeb679887ae", "text": "One black dog has all four paws off the earth while the other remains firmly planted.", "image_id": "2303951441_3c8080907a.jpg", "rel": "data/flickr8k/Images/2303951441_3c8080907a.jpg"}, {"id": "059cadc3721f", "text": "The striped pattern of number eight stands out sharply against the brown earth of the track.", "image_id": "3723903586_e98d3d8ec7.jpg", "rel": "data/flickr8k/Images/3723903586_e98d3d8ec7.jpg"}, {"id": "755f0823985c", "text": "Splashing past submerged stones, the dog leaps with full momentum through the green-tinted creek shallows.", "image_id": "2574230252_f5a1382dd4.jpg", "rel": "data/flickr8k/Images/2574230252_f5a1382dd4.jpg"}, {"id": "2107dc02a75b", "text": "Five people shout together with wide, animated faces under the room light.", "image_id": "3358558292_6ab14193ed.jpg", "rel": "data/flickr8k/Images/3358558292_6ab14193ed.jpg"}, {"id": "04249e830936", "text": "A man wearing a complete suit jacket displays a protest sign in the middle of casually dressed weekenders.", "image_id": "251958970_fa6b423f23.jpg", "rel": "data/flickr8k/Images/251958970_fa6b423f23.jpg"}, {"id": "a9acf19531f6", "text": "A woman in black clothes props one leg stiffly in the narrow space.", "image_id": "374124237_51f62b6937.jpg", "rel": "data/flickr8k/Images/374124237_51f62b6937.jpg"}, {"id": "7300bddb50fd", "text": "The girls lean closely against the painted blue bench, sheltered under the shade of bright umbrellas.", "image_id": "3217056901_fe2c70377d.jpg", "rel": "data/flickr8k/Images/3217056901_fe2c70377d.jpg"}, {"id": "33a897210e96", "text": "The walker operates the dark dog from what appears to be a very safe and generous distance.", "image_id": "411863595_d77156687e.jpg", "rel": "data/flickr8k/Images/411863595_d77156687e.jpg"}, {"id": "d1c7f58f2d09", "text": "Posing side by side for a photo, the man and woman smile brightly beneath their sunglasses.", "image_id": "271660510_dd4ba34b35.jpg", "rel": "data/flickr8k/Images/271660510_dd4ba34b35.jpg"}, {"id": "5d1fbaaf7c44", "text": "Two girls hold the upside-down child up high, straining to maintain their smiles for the camera lens.", "image_id": "2766325714_189bbff388.jpg", "rel": "data/flickr8k/Images/2766325714_189bbff388.jpg"}, {"id": "7c6989a9c996", "text": "A few people mingle quietly across the dim floor beneath rows of silent photographs.", "image_id": "2575647360_f5de38c751.jpg", "rel": "data/flickr8k/Images/2575647360_f5de38c751.jpg"}, {"id": "4d1394536178", "text": "Rather than staying in the lake, a man chooses to ride a board directly across a giant floating plastic wedge.", "image_id": "2899622876_b673b04967.jpg", "rel": "data/flickr8k/Images/2899622876_b673b04967.jpg"}, {"id": "fda5cf926ea2", "text": "Two little girls dash across a slick hardwood floor in the house, feet skidding on the polished surface.", "image_id": "3388330419_85d72f7cda.jpg", "rel": "data/flickr8k/Images/3388330419_85d72f7cda.jpg"}, {"id": "43665f9ddfa2", "text": "Several band members in green and white outfits freeze with their arms thrust out in absolute, rigid uniformity.", "image_id": "2534194182_ac53035cf4.jpg", "rel": "data/flickr8k/Images/2534194182_ac53035cf4.jpg"}, {"id": "1e7dccea6712", "text": "The dog moves smoothly across the open lawn, holding the small yellow toy between its teeth.", "image_id": "3091912922_0d6ebc8f6a.jpg", "rel": "data/flickr8k/Images/3091912922_0d6ebc8f6a.jpg"}, {"id": "5e1b49834f81", "text": "The girl sprints across the wet beach toward a man who is staring straight up into nothing.", "image_id": "3229282764_a4a515f4e2.jpg", "rel": "data/flickr8k/Images/3229282764_a4a515f4e2.jpg"}, {"id": "80426a3c67a0", "text": "Mid-air, the brown cow scrambles forward while the dog snaps at its heels by the metal gate.", "image_id": "2500567791_101d5ddee3.jpg", "rel": "data/flickr8k/Images/2500567791_101d5ddee3.jpg"}, {"id": "e7b524375b4e", "text": "The child is pulled upward from the play area, leaving the space behind.", "image_id": "2587818583_4aa8e7b174.jpg", "rel": "data/flickr8k/Images/2587818583_4aa8e7b174.jpg"}, {"id": "f385910392f4", "text": "Five people smile openly among the tall green grass while three obedient dogs sit close.", "image_id": "3047144646_2252ff8e04.jpg", "rel": "data/flickr8k/Images/3047144646_2252ff8e04.jpg"}, {"id": "91c38024d643", "text": "The woman in a red jacket smiles at the camera beneath a flat, pale grey sky.", "image_id": "3213992947_3f3f967a9f.jpg", "rel": "data/flickr8k/Images/3213992947_3f3f967a9f.jpg"}, {"id": "eae7e1bfc3cd", "text": "A mud-covered woman grins brightly as she joins the colorful outdoor gathering.", "image_id": "2602085456_d1beebcb29.jpg", "rel": "data/flickr8k/Images/2602085456_d1beebcb29.jpg"}, {"id": "87bd5b6d03b1", "text": "The orderly row against the wall completely collapses as soon as one kid decides to run.", "image_id": "3556792157_d09d42bef7.jpg", "rel": "data/flickr8k/Images/3556792157_d09d42bef7.jpg"}, {"id": "29721709ae26", "text": "A motocross driver speeds by during a race, vanishing down the empty stretch of circuit.", "image_id": "3613375729_d0b3c41556.jpg", "rel": "data/flickr8k/Images/3613375729_d0b3c41556.jpg"}, {"id": "648e3f87ac01", "text": "Rust lines the side of the red tugboat as it edges into the silent port.", "image_id": "3367851138_757d6bd2ef.jpg", "rel": "data/flickr8k/Images/3367851138_757d6bd2ef.jpg"}, {"id": "c1b688e05cfb", "text": "Mid-stride across the dandelion patch, the heavy shaggy dog charges forward with fur blowing straight back.", "image_id": "459814265_d48ba48978.jpg", "rel": "data/flickr8k/Images/459814265_d48ba48978.jpg"}, {"id": "27f8c01212f2", "text": "A smiling boy pulls something out of the magician's bag, the edges of the room cast in shadow.", "image_id": "1594038143_57f299aa8a.jpg", "rel": "data/flickr8k/Images/1594038143_57f299aa8a.jpg"}, {"id": "34ac1c8ee77c", "text": "Two energetic dogs scramble along the wet sand, tussling over a bright blue ball by the water.", "image_id": "3199460792_deef518c01.jpg", "rel": "data/flickr8k/Images/3199460792_deef518c01.jpg"}, {"id": "80cbd033610a", "text": "He ascends a sheer wall with minimal visible gear, treating gravity as purely optional.", "image_id": "219843859_94b6d0a580.jpg", "rel": "data/flickr8k/Images/219843859_94b6d0a580.jpg"}, {"id": "bf771f88dca0", "text": "A little boy tilts his head slightly, red traces from his snack outlining his small mouth.", "image_id": "2128119486_4407061c40.jpg", "rel": "data/flickr8k/Images/2128119486_4407061c40.jpg"}, {"id": "ddca2552c928", "text": "A man in a bright Santa Claus suit and festive mask spreads his hands out along the crowded sidewalk.", "image_id": "3106223494_52d4d2d75d.jpg", "rel": "data/flickr8k/Images/3106223494_52d4d2d75d.jpg"}, {"id": "78ce58327f80", "text": "A lone figure on a country road grows smaller against the grey treeline and wide sky.", "image_id": "161905204_247c6ca6de.jpg", "rel": "data/flickr8k/Images/161905204_247c6ca6de.jpg"}, {"id": "764832a17b8d", "text": "In a plain gray t-shirt, a woman holds a child layered in dark sleeves and a light smock.", "image_id": "3047751696_78c2efe5e6.jpg", "rel": "data/flickr8k/Images/3047751696_78c2efe5e6.jpg"}, {"id": "95a19e11de05", "text": "Against the dark window and brick wall, a woman stands quietly holding her violin.", "image_id": "2762702644_2aa3bf9680.jpg", "rel": "data/flickr8k/Images/2762702644_2aa3bf9680.jpg"}, {"id": "b211861b8a27", "text": "A boy leaps his skateboard across the ledge under a bright blue sky with scattered clouds.", "image_id": "3264350290_f50494e835.jpg", "rel": "data/flickr8k/Images/3264350290_f50494e835.jpg"}, {"id": "ccaf3e12ac82", "text": "A dog steps lightly across the thin layer of fresh snow scattered over the red-brown trail.", "image_id": "3166969425_b5ace2f9c2.jpg", "rel": "data/flickr8k/Images/3166969425_b5ace2f9c2.jpg"}, {"id": "88cd4b48b71e", "text": "A circle of young people sits around the glowing fire pit while total blackness surrounds them.", "image_id": "69710411_2cf537f61f.jpg", "rel": "data/flickr8k/Images/69710411_2cf537f61f.jpg"}, {"id": "4fe4064375c9", "text": "Balanced on the narrow metal handrail, the man slides down toward the brick landing.", "image_id": "3612825666_54f5a2bc06.jpg", "rel": "data/flickr8k/Images/3612825666_54f5a2bc06.jpg"}, {"id": "6775b9cfb7bf", "text": "One man reaches up to clutch his head as the speaker delivers remarks into the microphone.", "image_id": "3440724965_03d6ca5399.jpg", "rel": "data/flickr8k/Images/3440724965_03d6ca5399.jpg"}, {"id": "a4c614227454", "text": "Kids navigate the dark current directly in front of the narrow wooden bridge posts.", "image_id": "2189995738_352607a63b.jpg", "rel": "data/flickr8k/Images/2189995738_352607a63b.jpg"}, {"id": "662caab9409f", "text": "Against a blank horizon, two small figures struggle over a surging beach swell.", "image_id": "3319020762_d429d56a69.jpg", "rel": "data/flickr8k/Images/3319020762_d429d56a69.jpg"}, {"id": "a8fdce3864bb", "text": "Four kids turn an unusual architectural structure into a lively playground.", "image_id": "3410215754_5d5caeffaf.jpg", "rel": "data/flickr8k/Images/3410215754_5d5caeffaf.jpg"}, {"id": "f0a8d9c2864e", "text": "Nine people and four small children attempt to squeeze into the space before a single brick fireplace.", "image_id": "3197891333_b1b0fd1702.jpg", "rel": "data/flickr8k/Images/3197891333_b1b0fd1702.jpg"}, {"id": "e57335fd11f8", "text": "The afternoon sun highlights the bright yellow and red backpacks as two children walk unhurriedly along.", "image_id": "3228960484_9aab98b91a.jpg", "rel": "data/flickr8k/Images/3228960484_9aab98b91a.jpg"}, {"id": "4343aab23f0a", "text": "Each strand of the dog's long brown coat lifts softly as it crosses the course.", "image_id": "524698457_77ba13840a.jpg", "rel": "data/flickr8k/Images/524698457_77ba13840a.jpg"}, {"id": "837c95bbf8ab", "text": "Foaming white surf sprays upward as a girl in a bikini dashes toward the shore.", "image_id": "2726262796_03bd63a155.jpg", "rel": "data/flickr8k/Images/2726262796_03bd63a155.jpg"}, {"id": "3c208b70fd4e", "text": "The dog drops its weight forward as it comes down the steep flight of steps.", "image_id": "3449718979_e987c64e2d.jpg", "rel": "data/flickr8k/Images/3449718979_e987c64e2d.jpg"}, {"id": "216a32c80425", "text": "The dog leaps effortlessly through the open field, brushing against dozens of bright blossoms.", "image_id": "2053441349_a98b5fc742.jpg", "rel": "data/flickr8k/Images/2053441349_a98b5fc742.jpg"}, {"id": "cf328b5d7b85", "text": "Through the silent white ground, a fluffy dog runs alone carrying a single dry stick.", "image_id": "3361210233_962d630ec5.jpg", "rel": "data/flickr8k/Images/3361210233_962d630ec5.jpg"}, {"id": "534dc07cf169", "text": "Two bike riders stand geared up and ready, three bikes parked neatly beside the car.", "image_id": "2877159456_ea4a46b0d2.jpg", "rel": "data/flickr8k/Images/2877159456_ea4a46b0d2.jpg"}, {"id": "bd499d639442", "text": "White lining shows beneath the red jersey as the player hangs isolated in the air over the pitch.", "image_id": "3326454455_960e5442e9.jpg", "rel": "data/flickr8k/Images/3326454455_960e5442e9.jpg"}, {"id": "f02482b40083", "text": "Close beside her, the middle-aged man keeps his eyes devoted to the middle-aged woman.", "image_id": "3040051410_6205682ba3.jpg", "rel": "data/flickr8k/Images/3040051410_6205682ba3.jpg"}, {"id": "a69f1182b288", "text": "Wearing number eight, the black dog stretches forward at maximum speed with challengers right at its side.", "image_id": "2191329761_3effd856c5.jpg", "rel": "data/flickr8k/Images/2191329761_3effd856c5.jpg"}, {"id": "5d1cb4899dca", "text": "One boy empties water over another, the stream dissolving into the grey wet shoreline.", "image_id": "2271468944_3264d29208.jpg", "rel": "data/flickr8k/Images/2271468944_3264d29208.jpg"}, {"id": "0520b74be71b", "text": "Wearing a bright blue cap, the man relaxes on his small stool amidst the cool shade of the trees.", "image_id": "307301755_48919ef1b2.jpg", "rel": "data/flickr8k/Images/307301755_48919ef1b2.jpg"}, {"id": "e9411af29868", "text": "A small child plays on the tire swing, kicking barefoot above the green grass.", "image_id": "2313822078_282dc07531.jpg", "rel": "data/flickr8k/Images/2313822078_282dc07531.jpg"}, {"id": "61e9a256485a", "text": "One child takes bubble blowing extremely seriously while the other stands back with a pacifier.", "image_id": "3120953244_b00b152246.jpg", "rel": "data/flickr8k/Images/3120953244_b00b152246.jpg"}, {"id": "9497aac4aad7", "text": "Two women stand side by side on the pavement, one holding a drink as shadows gather behind them.", "image_id": "862156271_3eacea90a8.jpg", "rel": "data/flickr8k/Images/862156271_3eacea90a8.jpg"}, {"id": "2a2c272d9ad3", "text": "The dog's amber coat gleams in the bright outdoor air as it tracks the bouncing ball.", "image_id": "1510078253_96e9ec50e7.jpg", "rel": "data/flickr8k/Images/1510078253_96e9ec50e7.jpg"}, {"id": "f11d74cb08fb", "text": "Beside the empty patch of grass, the girl holds two small balloons and moves forward alone.", "image_id": "3665996775_6d7d9a46f1.jpg", "rel": "data/flickr8k/Images/3665996775_6d7d9a46f1.jpg"}, {"id": "b7265d5589cc", "text": "The young girl pauses amid the shimmering haze of a falling spray of water.", "image_id": "3765374230_cb1bbee0cb.jpg", "rel": "data/flickr8k/Images/3765374230_cb1bbee0cb.jpg"}, {"id": "afd610f0e270", "text": "The purple harness pulls tight across the dog's chest as its neck whips around violently.", "image_id": "2279945145_8815c59217.jpg", "rel": "data/flickr8k/Images/2279945145_8815c59217.jpg"}, {"id": "320914b418eb", "text": "The goalie stands completely alone before the empty netted frame across the scratched ice.", "image_id": "3138504165_c7ae396294.jpg", "rel": "data/flickr8k/Images/3138504165_c7ae396294.jpg"}, {"id": "9b80e3a01f5a", "text": "Hugging the wet curve at high speed, the blue motorcycle and sidecar lean dangerously close to the slick pavement.", "image_id": "3604314527_5077cd9d43.jpg", "rel": "data/flickr8k/Images/3604314527_5077cd9d43.jpg"}, {"id": "acc8ed9a9c20", "text": "Settled on the grass in the quiet meadow, she spends the quiet day tossing toys for her companion.", "image_id": "756521713_5d3da56a54.jpg", "rel": "data/flickr8k/Images/756521713_5d3da56a54.jpg"}, {"id": "5f3b458e0a39", "text": "Behind the wooden window railing, the children stay indoors and look through the opening.", "image_id": "3091921457_83eee69591.jpg", "rel": "data/flickr8k/Images/3091921457_83eee69591.jpg"}, {"id": "cef40311bd20", "text": "They share the small table beneath the blue snowflake sign, one seated and one standing quietly together.", "image_id": "3699318394_6193f2c8e0.jpg", "rel": "data/flickr8k/Images/3699318394_6193f2c8e0.jpg"}, {"id": "d0155bf9cdb7", "text": "The warm afternoon glow rests on his red sweatshirt as pedestrians stroll down the sidewalk.", "image_id": "2845246160_d0d1bbd6f0.jpg", "rel": "data/flickr8k/Images/2845246160_d0d1bbd6f0.jpg"}, {"id": "85efa6e3122f", "text": "Two women maintain an embrace, frozen in position facing the camera.", "image_id": "3721799573_2f470950e0.jpg", "rel": "data/flickr8k/Images/3721799573_2f470950e0.jpg"}]};

function intro(){
  M.innerHTML = `<div class="intro">
    <h2>${D.mode === 'image' ? 'Caption + photograph' : 'Caption only'} &mdash; guess the register</h2>
    <p>You will see ${D.items.length} captions${D.mode === 'image' ? ', each with its photograph' : ''}.
    Each was written to convey exactly one of five registers. Pick which one you think was asked for.</p>
    <p><b>Go on instinct.</b> First reaction is the measurement &mdash; deliberating changes what
    is being tested. There is no feedback, deliberately: knowing whether you were right would
    train you mid-task.</p>
    <p>If a caption reads as <b>plain description with no emotional colouring</b>, press
    <kbd>0</kbd> for &ldquo;no register&rdquo;. That is a real answer, not a skip: the share of
    captions nobody can place is exactly what this corpus needs to know. <b>Do not use it when
    you are torn between two registers</b> &mdash; guess in that case, because a caption that
    suggests two is doing something different from one that suggests none.</p>
    <p>Keys <kbd>1</kbd>&ndash;<kbd>5</kbd>, plus <kbd>0</kbd>. Roughly ${Math.ceil(D.items.length/10)} minutes.</p>
    <p style="margin-top:20px"><button class="sec pri" onclick="go()">Start</button></p></div>`;
}
function go(){ render(); }

function render(){
  if (S.i >= D.items.length) return finish();
  const it = D.items[S.i];
  document.getElementById('pos').textContent = `${S.i+1} / ${D.items.length}`;
  document.getElementById('fill').style.width = (100*S.i/D.items.length)+'%';
  M.innerHTML =
    (D.mode === 'image' ? `<img id="img" src="${esc(it.rel)}" style="display:block" alt="">` : '')
    + `<p id="cap">&ldquo;${esc(it.text)}&rdquo;</p><div class="opts">`
    + D.registers.map(r => `<button data-r="${r}">${r}<b>${HINT[r]}</b></button>`).join('')
    + `</div>`
    + `<div class="neutral"><button data-r="neutral">no register &mdash; this reads neutral<b>0</b></button>
       <p>Use this when the caption carries no emotional register at all &mdash;
       not when you are torn between two.</p></div>`;
  M.querySelectorAll('[data-r]').forEach(b => b.onclick = () => answer(b.dataset.r));
}
function answer(r){
  S.answers[D.items[S.i].id] = r; S.i++; save(); render();
}
function finish(){
  document.getElementById('fill').style.width = '100%';
  const n = Object.keys(S.answers).length;
  const nn = Object.values(S.answers).filter(x => x === 'neutral').length;
  M.innerHTML = `<div class="done"><h2>Done &mdash; ${n} answered${nn ? `, ${nn} marked neutral` : ''}</h2>
    <p style="color:var(--mut)">Press <b>Export results</b> and hand the file back.
    Your score is not shown here: computing it needs the answer key, which this page
    deliberately does not contain.</p></div>`;
}
document.getElementById('back').onclick = () => { if (S.i>0){ S.i--; save(); render(); } };
document.getElementById('skip').onclick = () => { S.i++; save(); render(); };
document.addEventListener('keydown', e => {
  const k = ['1','2','3','4','5'].indexOf(e.key);
  if (k >= 0 && S.i < D.items.length) answer(D.registers[k]);
  if (e.key === '0' && S.i < D.items.length) answer('neutral');
  if (e.key === 'ArrowLeft') document.getElementById('back').click();
});
document.getElementById('exp').onclick = () => {
  const A = Object.values(S.answers);
  const out = {tool:'make_guess_task.py', mode:D.mode, seed:D.seed, source:D.source,
    n_items:D.items.length, answered:A.length,
    n_neutral:A.filter(x => x === 'neutral').length,
    has_neutral_option:true,
    exported_at:new Date().toISOString(), answers:S.answers};
  const b = new Blob([JSON.stringify(out,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = `emocap-guess-${D.mode}-${D.seed}.json`; a.click();
};
if (Object.keys(S.answers).length || S.i) render(); else intro();
</script></body></html>
