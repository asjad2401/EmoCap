[project]
name = "emocap"
version = "2.0.0.dev0"
description = "Emotion-conditioned image captioning: a pre-registered ablation over emotion-injection strategies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.0",
    "google-cloud-storage>=3.13.1",
]

[project.optional-dependencies]
# Caption generation (stage 02/03) — runs locally, needs the Gemini key.
gen = ["google-genai>=0.3", "tenacity>=8.2"]
# Evaluation (stage 06/10) — metrics and the emotion classifier.
eval = ["nltk>=3.9", "scikit-learn>=1.4", "pycocoevalcap>=1.2"]
# Vision (stage 04).
vision = ["pillow>=10.2"]
# Figures (stage 11).
viz = ["matplotlib>=3.8"]
# Shipping arms, features and the frozen classifier to Kaggle for the GPU runs (stage 05).
kaggle = ["kaggle>=1.6"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emocap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: needs a real pretrained model download"]
