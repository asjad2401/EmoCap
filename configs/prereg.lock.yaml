# ═══════════════════════════════════════════════════════════════════════════
# FROZEN at git tag `prereg-v1`. Do not edit.
#
# Stage 10 (metrics_and_anchors) hashes the live configs against this file and
# refuses to run on a mismatch. To change anything here, log the change in
# docs/deviations.md, bump to prereg-v2, and say so in the write-up.
# ═══════════════════════════════════════════════════════════════════════════

study:
  name: "EmoCap: where should emotion enter a caption decoder?"
  emotions: [joyful, sad, tense, romantic, humorous]   # order fixes emotion_id
  seeds: [42, 1337, 2024]
  conditions: [V0, V1, V2, V3, C]
  tracks: [A_lstm, B_clipcap]

data:
  dataset: flickr8k
  neutral_source: human_annotations       # NOT a VLM. See docs/deviations.md if changed.
  captions_per_image: 5                   # Flickr8k ships 5 human captions
  references_per_cell: 5                   # one per human caption, per emotion
  split_source: official_flickr8k          # Hodosh et al. 2013 train/dev/test lists
  split_sizes: {train: 6000, val: 1000, test: 1000}
  split_by: image_id                       # never by row -- prevents leakage
  split_seed: 42                           # only for the 91 images outside the official lists
  # PROVISIONAL until the stage-02 probe finalises it; pinned before the prereg-v1
  # tag. gemini-2.0-flash (the pilot's model) has been retired and is no longer
  # served -- the config named a model that no longer exists. Must always be an
  # explicit version, never a moving alias, or the dataset's provenance is unknown.
  generator_model: "gemini-3.1-flash-lite"
  generation_input: image_plus_human_captions   # multimodal; Moondream retired
  generator_multimodal: true
  # Each register also returns a self-reported fit: 0 natural, 1 strained, 2 no honest
  # reading of this register exists for this caption. RECORDED ONLY -- it does not
  # predict which cells contain invented detail (defect rate 1.6/2.6/2.4% by level,
  # flat), so it is not a filter. Excluding strain-2 cells from training would be a new
  # pre-registered exclusion and has NOT been decided. Absent on pre-2026-08-19
  # records, where a missing value means unknown, never 0.
  generator_reports_strain: true
  target_caption_words: {min: 8, max: 24}

decode:                                    # identical for every variant and track
  beam_size: 4
  max_new_tokens: 40
  min_new_tokens: 4
  length_penalty: 1.0
  no_repeat_ngram_size: 3

metrics:
  primary: emotion_accuracy                # held-out classifier, top-1
  secondary: [cider_d, bleu_4, clipscore, distinctiveness]
  confirmatory: human_eval
  smallest_effect_of_interest: 0.10         # +10 points of emotion accuracy vs V0
  bootstrap:
    resamples: 10000
    cluster_by: image_id                   # the 5 emotion cells of one image are not independent
    ci: 0.95
  multiple_comparisons: holm_bonferroni     # 3 comparisons per track

anchors:
  # UNCALIBRATED as registered -- see gates.ceiling_min below and §6 of the
  # preregistration. Human style-conditioned captions measure 0.726, not 0.85.
  ceiling: reference_captions
  floor: shuffled_emotion_labels            # expect ~0.20 (chance)
  # Third anchor, added 2026-08-18 after auditing the Part 0 sample, then substantially
  # revised on 2026-08-19. The rates and the value quoted here originally -- "bright" in
  # 31% of joyful, "alone" in 21% of sad, "soft" in 26% of romantic, and a keyword rule at
  # 53.9% -- were measured on the *v1 prompt*, which has since been replaced. Under the
  # final v5 prompt those rates are 14%, 1% and 6%. Do not quote the v1 figures as if they
  # described this corpus.
  #
  # So a large share of the PRIMARY metric is available without any emotional
  # register at all. Reporting the classifier alone would credit the captioning model
  # for keyword emission. This anchor makes that share explicit: the model's real
  # contribution is the margin above it, not the raw accuracy.
  # THE ANCHOR IS SAMPLE-SIZE DEPENDENT AND MUST NOT BE STORED AS A SINGLE NUMBER.
  # Measured on the generated corpus with the estimator below:
  #
  #     4,486 cells   0.440 (sd 0.007 over 10 image-disjoint subsamples)
  #    24,925 cells   0.403
  #   201,900 cells   0.332 (per-seed .3320 / .3324 / .3327)
  #
  # A keyword rule fitted on few images transfers well to held-out images from that same
  # narrow pool and degrades as the pool widens, so the anchor FALLS ~11 points across
  # this range. The decline is a property of the estimator, not of one corpus: the human
  # comparison corpus falls -0.034 over the same span where ours falls -0.031.
  #
  # RULE, so the two cannot be mismatched again: the anchor is RECOMPUTED on whatever
  # evaluation set the primary metric is measured on, at that set's own n, and reported
  # beside it. It is never read from a stored constant. Three claims were retracted on
  # 2026-08-19 for comparing an anchor at one n against accuracy at another -- see
  # docs/lab-notebook.md and docs/deviations.md.
  lexical_shortcut: top25_keyword_rule
  lexical_shortcut_estimator: cv5_by_image_id_3seeds_fractional_ties
  lexical_shortcut_rule: recompute_on_each_evaluation_set_at_its_own_n
  # Reference values, for context only -- NOT thresholds. Prompt v1 vs v5 at matched n
  # (1,225-cell audit sets) shows what the prompt rewrite bought: 0.641 -> 0.394.
  lexical_shortcut_reference:
    full_corpus_201900_cells: 0.332
    test_split_24925_cells: 0.403
    matched_4486_cells: 0.440
    v1_prompt_1225_cells: 0.641
    human_corpus_4486_cells: 0.450
  # Pre-registered expectation, so it is not discovered after the fact: `tense` and
  # `humorous` have the weakest lexical markers (grips/edge 12%; seemingly/quite 6%)
  # and should dominate the classifier's confusion matrix.
  #
  # LEFT AS REGISTERED, AND CONTRADICTED. Measured difficulty on the v5 Part 0 sample
  # (the model's own strain report over 1,225 cells) orders them romantic 1.05 >
  # humorous 0.90 > sad 0.89 > tense 0.85 > joyful 0.15. `tense` is NOT among the
  # hardest; `romantic` is, which the independent human judge found as well. The
  # prediction is not retrofitted -- the disagreement is the result.
  expected_hardest_registers: [tense, humorous]

gates:                                      # a run or the study halts if these fail
  manipulation_check:
    v0_emotion_accuracy_max: 0.25
  # 0.85 was set a priori with NOTHING CALIBRATING IT, and it is very likely wrong.
  # Measured with the identical instrument at matched sample size, human-written
  # style-conditioned captions (Personality-Captions, 4,486 cells) reach only 0.726 -- so
  # this gate as written would halt a study on data matching human performance. That is a
  # miscalibrated instrument, not a finding about the corpus.
  #
  # Recalibrating against the measured human ceiling is legitimate PRE-TAG with the
  # reasoning logged, and indefensible afterwards. The value MUST be settled before
  # `prereg-v1` is applied. Until then 0.85 stands as registered.
  #
  # Two limits on the human figure: it is measured at 4,486 cells, the largest the human
  # corpus supports under a 1:1 trait mapping, and it is 5-way -- NOT comparable to binary
  # style-accuracy numbers reported on FlickrStyle10K or SentiCap.
  ceiling_min: 0.85
  ceiling_min_status: uncalibrated_pending_recalibration_before_tag
  ceiling_human_reference: 0.726
  visual_dependence_probe: required         # captions must change when features are zeroed
  truncation_rate_max: 0.02

exclusions:                                 # the ONLY grounds for dropping a run
  - crashed_or_incomplete_training
  - nan_loss
  - failed_visual_dependence_probe
# Poor metric performance is explicitly NOT grounds for exclusion.

human_eval:
  items: 150
  raters: 3
  scales: [tone_match_1_5, grounding_1_5]
  reliability: krippendorff_alpha
  blinded: true
  attention_checks: true
