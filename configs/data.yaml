# Operational data settings. Pre-registered values here MUST agree with
# configs/prereg.lock.yaml -- emocap.runtime.assert_matches_lock enforces it.

data:
  dataset: flickr8k
  neutral_source: human_annotations
  captions_per_image: 5
  references_per_cell: 5
  split_source: official_flickr8k      # Hodosh et al. 2013 train/dev/test lists
  split_sizes: {train: 6000, val: 1000, test: 1000}
  split_by: image_id
  split_seed: 42                        # only used for the 91 images outside the official lists
  # PROVISIONAL -- the stage-02 probe finalises this, then it is pinned before the
  # prereg-v1 tag. gemini-2.0-flash (the pilot's model, and what this said until
  # 2026-08-18) has been RETIRED and is no longer served.
  #
  # Must be an explicit version, never a moving alias like `gemini-flash-latest`:
  # an alias means the dataset was generated by an unknown model version and the
  # study is not reproducible.
  generator_model: "gemini-2.5-flash"
  generation_input: image_plus_human_captions
  generator_multimodal: true
  target_caption_words: {min: 8, max: 24}

# Operational only -- not pre-registered, safe to tune.
paths:
  captions_file: "data/flickr8k/captions.txt"
  images_dir: "data/flickr8k/Images"
  raw_generations: "data/generated/captions_raw.jsonl"
  clean_captions: "data/generated/captions.parquet"
  splits_file: "data/splits.csv"

generation:
  model: "gemini-2.5-flash"
  # Candidates the probe compares on identical inputs. All pinned versions.
  probe_models:
    - "gemini-2.5-flash"        # reference: GA, known quantity
    - "gemini-3.7-flash"        # newest GA flash
    - "gemini-3.1-flash-lite"   # cheapest tier; likeliest to violate the hard rules
  temperature: 0.9          # diversity across the 5 registers
  max_output_tokens: 4096   # Option B returns 25 captions in one response
  max_attempts: 3           # per (image, caption) before giving up
  concurrency: 8            # revise from the probe's --throughput result
  audit_sample: 200         # read this many by hand before the full run
