# Operational data settings. Pre-registered values here MUST agree with
# configs/prereg.lock.yaml -- emocap.runtime.assert_matches_lock enforces it.

data:
  dataset: flickr8k
  neutral_source: human_annotations
  captions_per_image: 5
  references_per_cell: 5
  split_source: official_flickr8k      # Hodosh et al. 2013 train/dev/test lists
  split_sizes: {train: 6000, val: 1000, test: 1000}
  split_by: image_id
  split_seed: 42                        # only used for the 91 images outside the official lists
  # PROVISIONAL -- the stage-02 probe finalises this, then it is pinned before the
  # prereg-v1 tag. gemini-2.0-flash (the pilot's model, and what this said until
  # 2026-08-18) has been RETIRED and is no longer served.
  #
  # Must be an explicit version, never a moving alias like `gemini-flash-latest`:
  # an alias means the dataset was generated by an unknown model version and the
  # study is not reproducible.
  generator_model: "gemini-3.1-flash-lite"
  generation_input: image_plus_human_captions
  generator_multimodal: true
  # See configs/prereg.lock.yaml: recorded only, never filtered on. Decided 2026-08-20 --
  # the flag does not predict grounding defects, and excluding strain-2 would take the
  # corpus from perfectly balanced to a 16.9% imbalance concentrated in `romantic`.
  generator_reports_strain: true
  strain_used_as_exclusion: false
  target_caption_words: {min: 8, max: 24}

# Operational only -- not pre-registered, safe to tune.
paths:
  # The Flickr8k distribution names this Flickr8k.token.txt. This key said
  # "captions.txt" until 2026-08-20 -- a file that does not exist. It went unnoticed
  # because run_stage02.py reads the token file by name rather than through this key,
  # but a config pointing at a missing file is a landmine for the next reader.
  captions_file: "data/flickr8k/Flickr8k.token.txt"
  images_dir: "data/flickr8k/Images"
  raw_generations: "data/generated/captions_raw.jsonl"
  # NOT YET GENERATED -- these are planned outputs of stages 03 and 01, not stale paths.
  clean_captions: "data/generated/captions.parquet"   # stage 03 output, does not exist yet
  splits_file: "data/splits.csv"                      # stage 01 output, does not exist yet

generation:
  model: "gemini-3.1-flash-lite"
  # Candidates the probe compares on identical inputs. All verified callable by a
  # real request on 2026-08-18 (`--validate-models`), all pinned versions.
  #
  # FINAL: gemini-3.1-flash-lite. Cheapest ($0.25/$1.50), zero thinking tokens, and
  # the only candidate that honours thinking_budget=0. Probe record: 100% completion,
  # ~1% rejection, 100% of captions inside the 8-24 word target, register similarity
  # 0.345 matching 3.5-flash. Weakest point is content recall 0.72 vs 0.83.
  #
  # Excluded and why:
  #   gemini-3.6-flash                  400 INVALID_ARGUMENT on thinking_budget=0, and
  #                                     spends 1,702-3,636 thinking tokens per call when
  #                                     allowed to -- $70 for plan B, not the $18 a
  #                                     trivial-prompt measurement suggested
  #   gemini-3.5-flash                  worst value: $192 vs $93 for the same plan
  #   gemini-2.5-flash / -lite / -pro   404 "no longer available to new users"
  #   gemini-flash-lite-latest          fastest measured, but a MOVING ALIAS --
  #                                     unknown model version = unreproducible dataset
  #   gemini-3.7-flash                  503 at validation time; recheck before use
  #   gemini-pro-latest, 3.1-pro        38-55 s/call -- 50+ h for the full run
  probe_models:
    - "gemini-3.6-flash"        # reference: 2.4 s/call, $0.75/$3.75
    - "gemini-3.1-flash-lite"   # cheapest: 1.4 s/call, $0.25/$1.50, honours thinking_budget=0
    - "gemini-3.5-flash"        # kept only as a quality ceiling reference; too dear to use
  # ── decisions settled by the stage-02 probe, 2026-08-18 ──
  # plan B: one call per image returning all 25 captions (5 human captions x 5
  # registers). Measured 100% complete (1500/1500) with zero positional decay, and
  # it costs $17.88 against $46.32 for one call per caption.
  plan: B
  # MANDATORY, not an option. With the schema: 1500/1500 captions. Without it:
  # 1249/1500 (83.3%), losing roughly one register per caption at random -- the loss
  # is uniform across output positions, so it is dropped keys, not model fatigue.
  use_response_schema: true
  # Arbitrary within 224-512. All three resolutions were indistinguishable on every
  # per-arm metric AND cost identically: the image is a flat 1,064 tokens at any
  # size, so downscaling buys nothing. Resolution is a non-decision.
  image_max_dim: 384
  temperature: 0.9          # diversity across the 5 registers
  max_output_tokens: 4096   # Option B returns 25 captions in one response
  # Thinking tokens are billed as output AND count against max_output_tokens, so a
  # tight budget returns empty text that looks like a model-quality problem. 0 asks
  # to disable it; measured, only the *lite* models honour that -- the full flash
  # models still spend 25-96 tokens thinking.
  thinking_budget: 0
  max_attempts: 3           # per (image, caption) before giving up
  concurrency: 24           # 3.37 calls/s measured, zero errors (2026-08-18)
  audit_sample: 200         # read this many by hand before the full run
  # Prompt version in src/emocap/data/prompt.py.
  #
  # v6 (2026-08-20) after a 200-caption HAND audit of v5 found only 1.0% of captions untrue
  # of their photograph but 30.5% failing to convey their register to a reader -- sad 52%,
  # romantic 42%. v5 had bought near-perfect faithfulness at the cost of the thing the study
  # measures, by banning light, weather, posture, gaze and pace: the whole palette prose uses
  # for mood. v6 converts those bans into verification tests (use them, check they are true
  # of the image), permits interpretation, adds a sorting test for distinctness, and adds
  # "look away from the event" for registers the subject matter resists.
  #
  # gemini-3.5-flash on the IDENTICAL v5 prompt was measured and did NOT help -- register
  # overlap 0.4007 -> 0.4175, WORSE, because its higher content recall (0.85 vs 0.78) hugs
  # the source caption even closer. The bottleneck was the prompt, not the model.
  prompt_version: v10
  # DECIDED 2026-08-21 on a 200-item blind register-guess, 100 captions per arm, mixed
  # into one sitting so practice and fatigue affect both equally.
  #
  #   arm            human(FCE)  neutral  anchor  gap     defects
  #   v7             0.650       n/a      0.553   +0.097  5.6%
  #   v10 / 3.7      0.592       11%      0.510   +0.082  5.2%
  #   v10 / 3.5      0.550       15%      0.557   -0.007  4.5%
  #
  # All three are statistically indistinguishable on legibility (3.5 vs 3.7 z=-0.60;
  # v7 vs 3.7 z=0.85), so the choice rests on everything else: 3.7 has the LOWEST anchor
  # of any corpus built, the lowest neutral rate, grounding better than v7 via rule 2c,
  # and costs half of 3.5. A low anchor matters most -- it is the shortcut a trained
  # decoder could learn instead of the register.
  generation_model: gemini-3.7-flash

# USD per 1M tokens. USER-SUPPLIED, from the Google AI pricing page on 2026-08-18.
# Not authoritative and not stable -- re-check before any run that matters, and note
# 3.6-flash is on introductory pricing that ENDS 2026-12-31 (then 1.50 / 7.50).
#
# thinking_billed_as_output: thinking tokens are charged at the output rate and are
# NOT included in candidates_token_count, so they are a surcharge on top of the
# visible output. Only the lite models honour thinking_budget=0.
# WARNING (2026-08-20): these are AI STUDIO prices and they do NOT appear to apply to
# Vertex. Computing Vertex spend with them gave $20.30 where the GCP console showed $13 --
# 36% over. Backing out from the console implies roughly $0.96/1M input and $5.76/1M output
# for gemini-3.5-flash, against the $1.50/$9.00 below. Two possible causes, not yet
# separated: Vertex publishes different prices, or GCP billing lags (it can trail 24h).
#
# Until that is resolved: use these for AI STUDIO batch estimates only, and treat the GCP
# console as ground truth for anything run through Vertex. Any Vertex cost projection built
# on this block should be quoted as an UPPER BOUND, not an estimate.
pricing:
  as_of: "2026-08-18"
  source: "user-supplied from Google AI pricing page (AI Studio; NOT verified for Vertex)"
  vertex_prices_verified: false
  vertex_observed_2026_08_20: {computed: 20.30, console: 13.00, ratio: 0.64}
  thinking_billed_as_output: true
  batch_api_discount: 0.50   # 50% off for non-realtime batch submission
  # CORRECTED 2026-08-20 from Google's Vertex AI documentation, via the researcher's GCP
  # agent. The earlier block attached the introductory discount to 3.6-flash; it belongs to
  # 3.7-flash. 3.6-flash is NOT discounted and is only 17% cheaper than 3.5-flash.
  models:
    gemini-3.5-flash:      {input: 1.50, output: 9.00}
    gemini-3.6-flash:      {input: 1.50, output: 7.50}
    gemini-3.7-flash:      {input: 0.75, output: 3.75, intro_until: "2026-12-31",
                            standard: {input: 1.50, output: 7.50}}
    gemini-3.1-flash-lite: {input: 0.25, output: 1.50}
  # Vertex discounts, documented: batch submission halves the token rate, and a context
  # cache READ costs 10% of the base input rate (plus storage per Mtoken-hour).
  context_cache_read_multiplier: 0.10

# Corpus-level vocabulary cap (src/emocap/data/vocab_cap.py). A PRE-REGISTERED
# corpus-construction rule: no content word may exceed its register's document-frequency
# cap when it is also >= min_lift times more common there than in any other register.
#
# Why it exists: prompt v6 turned technique into a template. `bright` reached 34% of
# joyful captions against 3% elsewhere; 28 words cleared 6% with >=2x lift, against 5 for
# v5. Masking them dropped the lexical anchor 0.638 -> 0.504, so ~70% of v6's anchor rise
# was template vocabulary. A decoder trained on that learns "joyful -> bright".
#
# Why the caps differ per register: classifier accuracy minus the human blind-guess score
# is +0.458 for joyful (the model uses `bright`, a reader does not) and +0.164 for sad
# (`empty`/`cold` genuinely read as sad). A wide gap means shortcut, so it is capped
# hardest; a narrow gap means real signal, so it is capped most gently.
#
# CAPS MUST BE FIXED BEFORE THE CORPUS IS BUILT. Tuning them after seeing the anchor is
# fitting the instrument to the result.
vocab_cap:
  enabled: true
  min_lift: 2.0          # in-register share / max share in any other register
  min_support: 40        # captions per register before anything is banned
  max_per_register: 12   # an unbounded ban list is how v5's registers collapsed
  refresh_every: 25      # images between recomputations during generation
  caps:
    joyful: 0.08
    tense: 0.10
    romantic: 0.10
    humorous: 0.14
    sad: 0.15

